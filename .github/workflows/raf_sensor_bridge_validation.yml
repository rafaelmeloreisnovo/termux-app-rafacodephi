name: RafaCodePhi sensor bridge validation

on:
  pull_request:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-sensor-bridge:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Validate Gradle wrapper
        run: chmod +x gradlew

      - name: Compile sensor bridge and run unit tests
        run: ./gradlew :app:testDebugUnitTest :app:assembleDebug --stacktrace --console=plain

      - name: Upload APK diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rafacodephi-sensor-bridge-validation-${{ github.run_id }}
          path: |
            app/build/outputs/apk/**/*.apk
            app/build/reports/tests/**
            app/build/test-results/**
          if-no-files-found: warn
