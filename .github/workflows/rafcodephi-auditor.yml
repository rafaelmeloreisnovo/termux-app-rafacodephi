# ci_track: ops
# ci_abis: n/a
name: RAFCODEPHI Operational Auditor

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:
    inputs:
      modules:
        description: Auditor modules to run
        required: false
        type: string
        default: all

permissions:
  contents: read

concurrency:
  group: rafcodephi-auditor-${{ github.event_name }}-${{ github.event_name == 'workflow_dispatch' && github.run_id || (github.event.pull_request.number || github.ref) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  auditor:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Run RAFCODEPHI auditor
        env:
          MODULES: ${{ inputs.modules || 'all' }}
        run: |
          bash scripts/rafcodephi_auditor.sh "$MODULES"

      - name: Publish auditor summary
        if: always()
        run: |
          if [ -f out/rafcodephi-auditor/auditor-report.md ]; then
            sed -n '1,140p' out/rafcodephi-auditor/auditor-report.md >> "$GITHUB_STEP_SUMMARY"
          else
            echo 'RAFCODEPHI auditor report was not generated.' >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload auditor artifacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: rafcodephi-auditor-${{ github.sha }}
          path: out/rafcodephi-auditor/**
          if-no-files-found: warn
