# ci_track: ops
# ci_abis: n/a
name: RAFCODEPHI Operational Auditor

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:
    inputs:
      modules:
        description: Auditor modules to run
        required: false
        type: string
        default: all

permissions:
  contents: read

concurrency:
  group: rafcodephi-auditor-${{ github.event_name }}-${{ github.event_name == 'workflow_dispatch' && github.run_id || (github.event.pull_request.number || github.ref) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  auditor:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Run RAFCODEPHI auditor
        env:
          MODULES: ${{ inputs.modules || 'all' }}
        run: |
          set -euo pipefail
          export LC_ALL=C
          if (( ${#MODULES} > 256 )) || [[ ! "$MODULES" =~ ^[a-zA-Z[:blank:]]+$ ]]; then
            echo "INVALID_MODULE_LIST" >&2
            exit 64
          fi
          read -r -a selected_modules <<< "$MODULES"
          if (( ${#selected_modules[@]} == 0 )); then
            echo "INVALID_MODULE_LIST: empty" >&2
            exit 64
          fi
          for module in "${selected_modules[@]}"; do
            case "$module" in
              all|inventory|cpu|memory|storage|git|clang|busybox|proot|report) ;;
              *) echo "INVALID_MODULE: $module" >&2; exit 64 ;;
            esac
          done
          bash scripts/rafcodephi_auditor.sh "${selected_modules[@]}"

      - name: Publish auditor summary
        if: always()
        run: |
          if [ -f out/rafcodephi-auditor/auditor-report.md ]; then
            sed -n '1,140p' out/rafcodephi-auditor/auditor-report.md >> "$GITHUB_STEP_SUMMARY"
          else
            echo 'RAFCODEPHI auditor report was not generated.' >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload auditor artifacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: rafcodephi-auditor-${{ github.sha }}
          path: out/rafcodephi-auditor/**
          if-no-files-found: warn
