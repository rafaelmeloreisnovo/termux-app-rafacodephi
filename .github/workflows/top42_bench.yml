# ci_track: ops
# ci_abis: n/a
name: top42-bench
on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:
permissions:
  contents: read

concurrency:
  group: top42-${{ github.event_name }}-${{ github.event_name == 'workflow_dispatch' && github.run_id || (github.event.pull_request.number || github.ref) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  top42:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Validate code/doc sync
        run: python3 scripts/validate_code_doc_sync.py
      - name: Generate TOP42 placeholders
        run: scripts/run_top42_bench.sh .
      - name: Upload TOP42 artifacts
        uses: actions/upload-artifact@v7
        with:
          name: top42-artifacts
          path: |
            top42.json
            top42.csv
            top42_env.txt
            top42_readme.md
