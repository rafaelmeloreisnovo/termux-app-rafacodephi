name: PR289 Checkout v6 Autofix

on:
  pull_request:
    branches:
      - master
    paths:
      - '.github/workflows/**'
  push:
    branches:
      - claude/llamarafaelia-process-analysis-rt4v8f
    paths:
      - '.github/workflows/pr289-checkout-v6-autofix.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  replace-invalid-checkout-major:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - name: Checkout PR branch
        uses: actions/checkout@v6
        with:
          ref: claude/llamarafaelia-process-analysis-rt4v8f
          fetch-depth: 0

      - name: Replace only checkout v7 with published v6
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          changed = []
          root = Path('.github/workflows')
          for path in sorted((*root.glob('*.yml'), *root.glob('*.yaml'))):
              text = path.read_text(encoding='utf-8')
              updated = text.replace('actions/checkout@v7', 'actions/checkout@v6')
              if updated != text:
                  path.write_text(updated, encoding='utf-8')
                  changed.append(str(path))

          print(f'changed_files={len(changed)}')
          for path in changed:
              print(path)
          PY

      - name: Prove replacement boundary
        shell: bash
        run: |
          set -euo pipefail
          if grep -RIn --include='*.yml' --include='*.yaml' 'actions/checkout@v7' .github/workflows; then
            echo 'checkout@v7 remains after replacement' >&2
            exit 1
          fi
          git diff -- .github/workflows | grep -E '^[+-].*uses: actions/checkout@v[67]' || true
          if git diff -- .github/workflows | grep -E '^[+-].*actions/upload-artifact@'; then
            echo 'artifact action changed outside the allowed boundary' >&2
            exit 1
          fi

      - name: Commit deterministic correction
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- .github/workflows; then
            echo 'No remaining checkout@v7 references.'
            exit 0
          fi
          git config user.name 'RAFCODEPHI CI'
          git config user.email 'actions@users.noreply.github.com'
          git add .github/workflows
          git commit -m 'fix(ci): replace invalid checkout v7 with published v6'
          git push origin HEAD:claude/llamarafaelia-process-analysis-rt4v8f
