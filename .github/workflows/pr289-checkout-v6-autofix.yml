name: PR289 Checkout v6 Patch Export

on:
  pull_request:
    branches:
      - master
    paths:
      - '.github/workflows/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  export-patched-workflows:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - name: Checkout PR branch with Git metadata
        uses: actions/checkout@v6
        with:
          ref: claude/llamarafaelia-process-analysis-rt4v8f
          fetch-depth: 0

      - name: Replace only checkout v7 with published v6
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          changed = []
          root = Path('.github/workflows')
          for path in sorted((*root.glob('*.yml'), *root.glob('*.yaml'))):
              text = path.read_text(encoding='utf-8')
              updated = text.replace('actions/checkout@v7', 'actions/checkout@v6')
              if updated != text:
                  path.write_text(updated, encoding='utf-8')
                  changed.append(str(path))

          Path('reports').mkdir(exist_ok=True)
          Path('reports/pr289-changed-workflows.txt').write_text(
              '\n'.join(changed) + ('\n' if changed else ''),
              encoding='utf-8',
          )
          print(f'changed_files={len(changed)}')
          for path in changed:
              print(path)
          PY

      - name: Prove replacement boundary
        shell: bash
        run: |
          set -euo pipefail
          if grep -RIn --include='*.yml' --include='*.yaml' 'actions/checkout@v7' .github/workflows; then
            echo 'checkout@v7 remains after replacement' >&2
            exit 1
          fi
          if git diff -- .github/workflows | grep -E '^[+-].*actions/upload-artifact@'; then
            echo 'artifact action changed outside the allowed boundary' >&2
            exit 1
          fi
          git diff -- .github/workflows > reports/pr289-workflows.patch
          git rev-parse HEAD > reports/pr289-parent-sha.txt
          git rev-parse HEAD^{tree} > reports/pr289-base-tree-sha.txt

      - name: Package corrected workflows and Git metadata
        shell: bash
        run: |
          set -euo pipefail
          tar -czf reports/pr289-patched-workflows.tar.gz \
            .github/workflows \
            .git \
            reports/pr289-changed-workflows.txt \
            reports/pr289-workflows.patch \
            reports/pr289-parent-sha.txt \
            reports/pr289-base-tree-sha.txt

      - name: Upload deterministic patch bundle
        uses: actions/upload-artifact@v7
        with:
          name: pr289-patched-workflows-${{ github.sha }}
          path: reports/pr289-patched-workflows.tar.gz
          if-no-files-found: error
          retention-days: 3
