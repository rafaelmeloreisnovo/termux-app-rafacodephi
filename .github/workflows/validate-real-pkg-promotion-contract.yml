# ci_track: ops
# ci_abis: n/a
name: Real Pkg Promotion Contract

on:
  push:
    branches: [ master ]
    paths:
      - scripts/device_pkg_smoke.sh
      - docs/ENGINEERING_RUNBOOK_RAFCODEPHI.md
      - docs/RUNTIME_TRUTH_TABLE.md
      - docs/audits/REAL_PKG_PROMOTION_CONTRACT.md
      - docs/audits/PKG_REAL_NEXT_PR_MARKER.md
      - tests/test_device_pkg_smoke_contract.py
      - tests/test_real_pkg_promotion_contract.py
      - tests/test_pkg_real_next_pr_marker.py
      - .github/workflows/validate-real-pkg-promotion-contract.yml
  pull_request:
    paths:
      - scripts/device_pkg_smoke.sh
      - docs/ENGINEERING_RUNBOOK_RAFCODEPHI.md
      - docs/RUNTIME_TRUTH_TABLE.md
      - docs/audits/REAL_PKG_PROMOTION_CONTRACT.md
      - docs/audits/PKG_REAL_NEXT_PR_MARKER.md
      - tests/test_device_pkg_smoke_contract.py
      - tests/test_real_pkg_promotion_contract.py
      - tests/test_pkg_real_next_pr_marker.py
      - .github/workflows/validate-real-pkg-promotion-contract.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  real-pkg-promotion-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install test dependencies
        run: python3 -m pip install --disable-pip-version-check pytest

      - name: Validate smoke state separation
        run: python3 -m pytest -q tests/test_device_pkg_smoke_contract.py::test_device_pkg_smoke_separates_minimal_layer_from_real_pkg

      - name: Validate minimal command gate
        run: python3 -m pytest -q tests/test_device_pkg_smoke_contract.py::test_device_pkg_smoke_keeps_minimal_commands_as_gate

      - name: Validate runbook promotion gate
        run: python3 -m pytest -q tests/test_device_pkg_smoke_contract.py::test_runbook_mentions_pkg_promotion_gate

      - name: Validate truth-table epistemic state
        run: python3 -m pytest -q tests/test_device_pkg_smoke_contract.py::test_truth_table_keeps_real_pkg_unproved_until_device_smoke

      - name: Validate real pkg promotion contract
        run: python3 -m pytest -q tests/test_real_pkg_promotion_contract.py

      - name: Validate next-PR marker
        run: python3 -m pytest -q tests/test_pkg_real_next_pr_marker.py
