name: Freestanding Enterprise Closure

on:
  workflow_dispatch:
  push:
    branches:
      - 'rafaelia/freestanding-proot-pkg-gate-*'
    paths:
      - 'bootstrap/proot_freestanding.c'
      - 'bootstrap/proot_syscall_bridge.h'
      - 'src/bootstrap/freestanding_string.h'
      - 'scripts/inject_freestanding_gate_into_bootstrap.py'
      - 'scripts/device_promote_freestanding_runtime.sh'
      - 'scripts/validate_freestanding_device_receipt.py'
      - 'tests/test_freestanding_device_receipt.py'
      - 'docs/contracts/raf.freestanding-runtime-evidence.v1.schema.json'
      - '.github/workflows/freestanding-enterprise-closure.yml'
  pull_request:
    paths:
      - 'bootstrap/proot_freestanding.c'
      - 'bootstrap/proot_syscall_bridge.h'
      - 'src/bootstrap/freestanding_string.h'
      - 'scripts/inject_freestanding_gate_into_bootstrap.py'
      - 'scripts/device_promote_freestanding_runtime.sh'
      - 'scripts/validate_freestanding_device_receipt.py'
      - 'tests/test_freestanding_device_receipt.py'
      - 'docs/contracts/raf.freestanding-runtime-evidence.v1.schema.json'
      - '.github/workflows/freestanding-enterprise-closure.yml'

permissions:
  contents: read

concurrency:
  group: freestanding-enterprise-${{ github.ref }}
  cancel-in-progress: true

env:
  TERMUX_PACKAGES_RAF_CHANNEL: candidate
  TERMUX_PACKAGES_RAF_REQUIRE_PINNED: 'true'
  CLAIM_ALLOWED: 'false'
  PHYSICAL_ANDROID: 'TOKEN_VAZIO'

jobs:
  evidence-contract:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Validate evidence implementation
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile \
            scripts/inject_freestanding_gate_into_bootstrap.py \
            scripts/validate_freestanding_device_receipt.py
          python3 -m unittest tests.test_freestanding_device_receipt -v
          /bin/sh -n scripts/device_promote_freestanding_runtime.sh
          python3 -m json.tool docs/contracts/raf.freestanding-runtime-evidence.v1.schema.json >/dev/null

  source-built-candidate:
    needs: evidence-contract
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    steps:
      - name: Checkout RAFCODEPHI app
        uses: actions/checkout@v7
        with:
          persist-credentials: false
          fetch-depth: 1

      - name: Resolve pinned termux-packages candidate
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build/reports
          python3 scripts/resolve_termux_packages_pin.py \
            "$TERMUX_PACKAGES_RAF_CHANNEL" \
            --github-env --json \
            | tee build/reports/freestanding-packages-pin.json

      - name: Setup Java 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Checkout exact patched termux-packages source
        uses: actions/checkout@v7
        with:
          repository: rafaelmeloreisnovo/termux-packages
          ref: ${{ env.TERMUX_PACKAGES_SHA }}
          path: termux-packages
          persist-credentials: false
          fetch-depth: 1

      - name: Gate source capabilities and RAFCODEPHI identity
        working-directory: termux-packages
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$TERMUX_PACKAGES_SHA"
          required=(
            scripts/properties.sh
            scripts/apply-rafcodephi-build-properties.py
            scripts/validate-rafcodephi-build-properties.sh
            scripts/run-docker.sh
            scripts/build-rafcodephi-real-bootstrap.sh
            packages/libxml2/build.sh
          )
          for path in "${required[@]}"; do test -f "$path"; done
          mkdir -p build/reports
          python3 scripts/apply-rafcodephi-build-properties.py \
            --properties scripts/properties.sh \
            --receipt build/reports/rafcodephi-freestanding-properties.json
          bash scripts/validate-rafcodephi-build-properties.sh

      - name: Source-build real ARM32 + ARM64 bootstraps
        working-directory: termux-packages
        shell: bash
        run: |
          set -euo pipefail
          chmod +x scripts/run-docker.sh scripts/build-rafcodephi-real-bootstrap.sh
          ./scripts/run-docker.sh \
            ./scripts/build-rafcodephi-real-bootstrap.sh \
            --architectures arm,aarch64 \
            2>&1 | tee build/reports/rafcodephi-freestanding-real-bootstrap.log

      - name: Gate immutable parent source-build manifest
        working-directory: termux-packages
        shell: bash
        run: |
          set -euo pipefail
          root=artifacts/rafcodephi-bootstrap
          manifest="$root/RAFCODEPHI_REAL_BOOTSTRAP_MANIFEST.txt"
          test -s "$manifest"
          test -s "$root/rafcodephi-bootstrap-arm.zip"
          test -s "$root/rafcodephi-bootstrap-aarch64.zip"
          grep -Fx 'schema=rafcodephi.real-bootstrap-sourcebuild/v1' "$manifest"
          grep -Fx 'package_name=com.termux.rafacodephi' "$manifest"
          grep -Fx 'prefix=/data/data/com.termux.rafacodephi/files/usr' "$manifest"
          grep -Fx 'bridge_allowed=false' "$manifest"
          grep -Fx 'legacy_prefix_allowed=false' "$manifest"
          grep -Fx 'claim_allowed_device_runtime=false' "$manifest"
          grep -Fx 'device_runtime_proof=TOKEN_VAZIO' "$manifest"
          sha256sum "$manifest" "$root"/*.zip | tee build/reports/rafcodephi-freestanding-parent.sha256

      - name: Create gate-bearing child bootstrap pair and child manifest
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y clang lld binutils file
          root=termux-packages/artifacts/rafcodephi-bootstrap
          child=build/freestanding-source
          mkdir -p "$child"
          cp "$root/rafcodephi-bootstrap-arm.zip" "$child/rafcodephi-bootstrap-arm.zip"
          cp "$root/rafcodephi-bootstrap-aarch64.zip" "$child/rafcodephi-bootstrap-aarch64.zip"
          python3 scripts/inject_freestanding_gate_into_bootstrap.py \
            --arm-zip "$child/rafcodephi-bootstrap-arm.zip" \
            --aarch64-zip "$child/rafcodephi-bootstrap-aarch64.zip" \
            --source-manifest "$root/RAFCODEPHI_REAL_BOOTSTRAP_MANIFEST.txt" \
            --child-manifest "$child/RAFCODEPHI_FREESTANDING_BOOTSTRAP_MANIFEST.txt" \
            --output-dir build/reports/freestanding-bootstrap
          sha256sum "$child"/* | tee build/reports/freestanding-child.sha256

      - name: Validate child pair with canonical strict importer
        shell: bash
        run: |
          set -euo pipefail
          child=build/freestanding-source
          python3 scripts/import_rafcodephi_real_bootstrap.py \
            --arch arm --zip "$child/rafcodephi-bootstrap-arm.zip" \
            --manifest "$child/RAFCODEPHI_FREESTANDING_BOOTSTRAP_MANIFEST.txt" \
            --validate-only
          python3 scripts/import_rafcodephi_real_bootstrap.py \
            --arch aarch64 --zip "$child/rafcodephi-bootstrap-aarch64.zip" \
            --manifest "$child/RAFCODEPHI_FREESTANDING_BOOTSTRAP_MANIFEST.txt" \
            --validate-only

      - name: Build APK matrix from exact gate-bearing child pair
        env:
          RAF_BOOTSTRAP_SOURCE: source-built-real
          RAF_REAL_BOOTSTRAP_ZIP_ARM: ${{ github.workspace }}/build/freestanding-source/rafcodephi-bootstrap-arm.zip
          RAF_REAL_BOOTSTRAP_ZIP_AARCH64: ${{ github.workspace }}/build/freestanding-source/rafcodephi-bootstrap-aarch64.zip
          RAF_REAL_BOOTSTRAP_MANIFEST: ${{ github.workspace }}/build/freestanding-source/RAFCODEPHI_FREESTANDING_BOOTSTRAP_MANIFEST.txt
          RELEASE_TRACK: internal
          APK_MATRIX_UNIT_TESTS_REQUIRED: 'true'
        run: ./scripts/build_apk_matrix.sh

      - name: Validate exact embedded pair after APK build preparation
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build/reports
          python3 tools/raf_bootstrap_profile.py validate \
            --zip app/src/main/cpp/rewritten-bootstrap-arm.zip \
            --expected-profile real-pkg --expected-arch arm \
            --package-name com.termux.rafacodephi \
            > build/reports/freestanding-embedded-arm.json
          python3 tools/raf_bootstrap_profile.py validate \
            --zip app/src/main/cpp/rewritten-bootstrap-aarch64.zip \
            --expected-profile real-pkg --expected-arch aarch64 \
            --package-name com.termux.rafacodephi \
            > build/reports/freestanding-embedded-aarch64.json
          python3 - <<'PY'
          import hashlib,json,zipfile
          from pathlib import Path
          matrix=json.loads(Path('build/reports/freestanding-bootstrap/freestanding-embedded-matrix.json').read_text())
          expected={r['architecture']:r['gate_sha256'] for r in matrix['reports']}
          for arch in ('arm','aarch64'):
              doc=json.loads(Path(f'build/reports/freestanding-embedded-{arch}.json').read_text())
              assert doc['structural_state']=='PASS', doc
              assert doc['profile']=='real-pkg', doc
              assert doc['device_validation']=='TOKEN_VAZIO', doc
              assert doc['claim_allowed'] is False, doc
              assert doc['classifications']['bin/apt']=='ELF', doc
              assert doc['classifications']['bin/apt-get']=='ELF', doc
              z=Path(f'app/src/main/cpp/rewritten-bootstrap-{arch}.zip')
              with zipfile.ZipFile(z) as zf:
                  gate=zf.read('libexec/rafproot-fs')
                  info=zf.read('BOOTSTRAP_INFO').decode()
              actual=hashlib.sha256(gate).hexdigest()
              assert actual==expected[arch], (arch,actual,expected[arch])
              assert f'BOOTSTRAP_FREESTANDING_GATE_SHA256={actual}' in info
              assert 'BOOTSTRAP_FREESTANDING_DEVICE_STATE=TOKEN_VAZIO' in info
          print('FREESTANDING_EXACT_EMBEDDED_PAIR=PASS')
          PY

      - name: Generate hash-bound candidate and enterprise receipts
        shell: bash
        run: |
          set -euo pipefail
          child=build/freestanding-source/RAFCODEPHI_FREESTANDING_BOOTSTRAP_MANIFEST.txt
          python3 scripts/generate_usable_beta_receipt.py \
            --apk-root dist/apk-matrix \
            --bootstrap-manifest "$child" \
            --arm-report build/reports/freestanding-embedded-arm.json \
            --arm64-report build/reports/freestanding-embedded-aarch64.json \
            --source-contract dist/source-contract/TERMUX_PACKAGES_RAFCODEPHI_SOURCE.env \
            --packages-sha "$TERMUX_PACKAGES_SHA" \
            --output build/reports/freestanding-usable-beta-receipt.json
          python3 - <<'PY'
          import hashlib,json
          from pathlib import Path
          beta=Path('build/reports/freestanding-usable-beta-receipt.json')
          matrix=Path('build/reports/freestanding-bootstrap/freestanding-embedded-matrix.json')
          child=Path('build/freestanding-source/RAFCODEPHI_FREESTANDING_BOOTSTRAP_MANIFEST.txt')
          source=json.loads(matrix.read_text())
          doc={
            'schema':'raf.freestanding-enterprise-candidate.v1',
            'usable_beta_receipt_sha256':hashlib.sha256(beta.read_bytes()).hexdigest(),
            'freestanding_bootstrap_matrix_sha256':hashlib.sha256(matrix.read_bytes()).hexdigest(),
            'parent_manifest_sha256':source['parent_manifest_sha256'],
            'child_manifest_sha256':hashlib.sha256(child.read_bytes()).hexdigest(),
            'build_state':'BUILD_PROVEN',
            'physical_android':'TOKEN_VAZIO',
            'reproduced_state':'TOKEN_VAZIO',
            'claim_allowed':False,
            'physical_evidence_command':'scripts/device_promote_freestanding_runtime.sh full'
          }
          out=Path('build/reports/freestanding-enterprise-candidate.json')
          out.write_text(json.dumps(doc,indent=2,sort_keys=True)+'\n')
          print(json.dumps(doc,indent=2,sort_keys=True))
          PY

      - name: Upload enterprise candidate and custody evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: freestanding-enterprise-${{ github.sha }}
          retention-days: 14
          if-no-files-found: warn
          path: |
            dist/apk-matrix/
            dist/source-contract/
            build/freestanding-source/
            build/reports/
            termux-packages/build/reports/
            termux-packages/artifacts/rafcodephi-bootstrap/
