# ci_track: ops
# ci_abis: armeabi-v7a
name: Android ARM32 Compatibility

# Compatibility entrypoint. Heavy implementation lives in _reusable-arm32-compat.yml.
on:
  workflow_call:
  workflow_dispatch:
  pull_request:
    branches: ["**"]
    paths:
      - 'app/**'
      - 'scripts/**'
      - 'gradle.properties'
      - 'settings.gradle'
      - 'build.gradle'
      - '.github/actions/**'
      - '.github/workflows/compatibility-arm32.yml'
      - '.github/workflows/_reusable-arm32-compat.yml'

permissions:
  contents: read

concurrency:
  group: arm32-canonical-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  compatibility-arm32:
    name: "📱 ARM32 v7 canônico"
    uses: ./.github/workflows/_reusable-arm32-compat.yml
    with:
      ndk_lane: canonical
    secrets: inherit
