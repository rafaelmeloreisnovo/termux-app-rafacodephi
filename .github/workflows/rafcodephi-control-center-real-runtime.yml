name: RAFCODEPHI Control Center Real Runtime

on:
  workflow_dispatch:
    inputs:
      termux_packages_ref:
        description: canonical | candidate | exact 40-char termux-packages commit
        required: true
        default: canonical
        type: string
  pull_request:
    paths:
      - 'data/contracts/termux-packages-rafcodephi-pin.v1.json'
      - 'scripts/resolve_termux_packages_pin.py'
      - 'app/src/main/AndroidManifest.xml'
      - 'app/src/main/java/com/termux/app/activities/BetaOrchestratorActivity.java'
      - 'app/src/main/java/com/termux/app/activities/BetaBootstrapWizardActivity.java'
      - 'app/src/main/java/com/termux/app/activities/SettingsActivity.java'
      - 'app/src/main/java/com/termux/app/BetaRealBootstrapRepair.java'
      - 'app/src/main/java/com/termux/app/BootstrapBaremetalGuard.java'
      - 'app/src/main/java/com/termux/app/BootstrapReadinessGate.java'
      - 'app/src/main/java/com/termux/app/BootstrapWizardSource.java'
      - 'app/src/main/java/com/termux/app/TermuxInstaller.java'
      - 'app/src/main/java/com/termux/app/orchestration/ControlCenter*.java'
      - 'app/src/main/res/xml/root_preferences.xml'
      - 'tests/test_beta_orchestrator_contract.py'
      - 'tests/test_rafcodephi_startup_and_settings_contract.py'
      - 'tests/test_settings_manifest_activity_contract.py'
      - '.github/workflows/rafcodephi-control-center-real-runtime.yml'
  push:
    branches: [master]
    paths:
      - 'data/contracts/termux-packages-rafcodephi-pin.v1.json'
      - 'scripts/resolve_termux_packages_pin.py'
      - 'app/src/main/AndroidManifest.xml'
      - 'app/src/main/java/com/termux/app/activities/BetaOrchestratorActivity.java'
      - 'app/src/main/java/com/termux/app/activities/BetaBootstrapWizardActivity.java'
      - 'app/src/main/java/com/termux/app/activities/SettingsActivity.java'
      - 'app/src/main/java/com/termux/app/BetaRealBootstrapRepair.java'
      - 'app/src/main/java/com/termux/app/BootstrapBaremetalGuard.java'
      - 'app/src/main/java/com/termux/app/BootstrapReadinessGate.java'
      - 'app/src/main/java/com/termux/app/BootstrapWizardSource.java'
      - 'app/src/main/java/com/termux/app/TermuxInstaller.java'
      - 'app/src/main/java/com/termux/app/orchestration/ControlCenter*.java'
      - 'app/src/main/res/xml/root_preferences.xml'
      - 'tests/test_beta_orchestrator_contract.py'
      - 'tests/test_rafcodephi_startup_and_settings_contract.py'
      - 'tests/test_settings_manifest_activity_contract.py'
      - '.github/workflows/rafcodephi-control-center-real-runtime.yml'

permissions:
  contents: read

concurrency:
  group: rafcodephi-control-center-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-real-runtime:
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    env:
      TERMUX_PACKAGES_SELECTOR: ${{ github.event_name == 'workflow_dispatch' && inputs.termux_packages_ref || 'canonical' }}
      RAFCODEPHI_APT_REPOSITORY_URL: https://raw.githubusercontent.com/rafaelmeloreisnovo/termux-packages/rafcodephi-apt-preview/repo
      RAFCODEPHI_APT_TRUST_MODE: development-trusted
      CLAIM_ALLOWED: 'false'
      PHYSICAL_ANDROID: TOKEN_VAZIO
    steps:
      - name: Checkout app
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          fetch-depth: 1

      - name: Resolve semantic termux-packages pin
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build/reports
          python3 scripts/resolve_termux_packages_pin.py \
            "$TERMUX_PACKAGES_SELECTOR" \
            --github-env --json \
            | tee build/reports/control-center-packages-pin-resolution.json

      - name: Setup Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Checkout exact termux-packages implementation
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: rafaelmeloreisnovo/termux-packages
          ref: ${{ env.TERMUX_PACKAGES_SHA }}
          path: termux-packages
          persist-credentials: false
          fetch-depth: 1

      - name: Bind RAFCODEPHI package and prefix
        working-directory: termux-packages
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$TERMUX_PACKAGES_SHA"
          mkdir -p build/reports
          python3 scripts/apply-rafcodephi-build-properties.py \
            --properties scripts/properties.sh \
            --receipt build/reports/control-center-properties.json
          bash scripts/validate-rafcodephi-build-properties.sh
          grep -Fx 'TERMUX_APP__PACKAGE_NAME="com.termux.rafacodephi"' scripts/properties.sh

      - name: Validate first-boot and Settings contracts
        shell: bash
        run: |
          set -euo pipefail
          python3 tests/test_rafcodephi_startup_and_settings_contract.py
          python3 tests/test_settings_manifest_activity_contract.py

      - name: Source-build live real-pkg bootstrap pair
        working-directory: termux-packages
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build/reports
          set +e
          ./scripts/run-docker.sh env \
            RAFCODEPHI_APT_REPOSITORY_URL="$RAFCODEPHI_APT_REPOSITORY_URL" \
            RAFCODEPHI_APT_TRUST_MODE="$RAFCODEPHI_APT_TRUST_MODE" \
            bash ./scripts/build-rafcodephi-live-bootstrap.sh --architectures arm,aarch64 \
            2>&1 | tee build/reports/rafcodephi-control-center-live-bootstrap.log
          build_status="${PIPESTATUS[0]}"
          set -e
          python3 - "$build_status" > build/reports/rafcodephi-control-center-live-bootstrap-status.json <<'PY'
          import json
          import sys

          status = int(sys.argv[1])
          print(json.dumps({
              "schema": "rafcodephi.control-center-live-bootstrap/v1",
              "state": "PASS" if status == 0 else "BLOCKED",
              "exit_code": status,
              "claim_allowed_release": False,
              "device_runtime_proof": "TOKEN_VAZIO",
          }, sort_keys=True))
          PY
          if [[ "$build_status" -ne 0 ]]; then
            echo "RAFCODEPHI_CONTROL_CENTER_BOOTSTRAP=BLOCKED exit_code=$build_status" >&2
            exit "$build_status"
          fi
          for arch in arm aarch64; do
            zip="artifacts/rafcodephi-bootstrap/rafcodephi-bootstrap-${arch}.zip"
            test -s "$zip"
            unzip -p "$zip" BOOTSTRAP_PROFILE.json | grep -F '"profile":"real-pkg"'
            unzip -p "$zip" BOOTSTRAP_PROFILE.json | grep -F '"package_repo_runtime_state":"DEVELOPMENT_REPOSITORY_CONFIGURED"'
            unzip -p "$zip" BOOTSTRAP_PROFILE.json | grep -F '"runtime_materialized":false'
            unzip -p "$zip" etc/apt/sources.list.d/termux.sources | grep -Fx 'Enabled: yes'
            unzip -p "$zip" etc/apt/sources.list.d/termux.sources | grep -Fx "URIs: $RAFCODEPHI_APT_REPOSITORY_URL"
          done

      - name: Upload source-build evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: rafcodephi-control-center-source-build-${{ github.sha }}
          if-no-files-found: warn
          path: |
            build/reports/control-center-packages-pin-resolution.json
            termux-packages/build/reports/rafcodephi-control-center-live-bootstrap.log
            termux-packages/build/reports/rafcodephi-control-center-live-bootstrap-status.json
            termux-packages/artifacts/rafcodephi-bootstrap/rafcodephi-bootstrap-arm.zip
            termux-packages/artifacts/rafcodephi-bootstrap/rafcodephi-bootstrap-aarch64.zip
            termux-packages/artifacts/rafcodephi-bootstrap/RAFCODEPHI_REAL_BOOTSTRAP_MANIFEST.txt

      - name: Setup Android SDK/NDK
        run: ./scripts/setup_android_toolchain.sh

      - name: Materialize exact embedded bootstrap set
        shell: bash
        run: |
          set -euo pipefail
          # Generate untouched x86 compatibility slots, then replace only ARM slots
          # with the source-built real-pkg pair. The legacy importer intentionally
          # models the old blocked repository, so this beta path hashes the live contract directly.
          bash scripts/build_bootstrap_profile.sh
          cp termux-packages/artifacts/rafcodephi-bootstrap/rafcodephi-bootstrap-arm.zip app/src/main/cpp/rewritten-bootstrap-arm.zip
          cp termux-packages/artifacts/rafcodephi-bootstrap/rafcodephi-bootstrap-aarch64.zip app/src/main/cpp/rewritten-bootstrap-aarch64.zip
          python3 -m pip install --disable-pip-version-check --quiet --target build/python-deps blake3
          PYTHONPATH="$PWD/build/python-deps" python3 - <<'PY' >> "$GITHUB_ENV"
          from pathlib import Path
          from blake3 import blake3
          import hashlib
          mapping = {
              'AARCH64': 'rewritten-bootstrap-aarch64.zip',
              'ARM': 'rewritten-bootstrap-arm.zip',
              'I686': 'rewritten-bootstrap-i686.zip',
              'X86_64': 'rewritten-bootstrap-x86_64.zip',
          }
          base = Path('app/src/main/cpp')
          for key, name in mapping.items():
              data = (base / name).read_bytes()
              print(f'TERMUX_BOOTSTRAP_SHA256_{key}={hashlib.sha256(data).hexdigest()}')
              print(f'TERMUX_BOOTSTRAP_BLAKE3_{key}={blake3(data).hexdigest()}')
          PY

      - name: Compile unit tests and debug split APKs
        shell: bash
        run: |
          set -euo pipefail
          ./gradlew :app:testDebugUnitTest --no-daemon
          TERMUX_SPLIT_APKS_FOR_DEBUG_BUILDS=1 ./gradlew :app:assembleDebug --no-daemon

      - name: Gate ARM32 install candidate
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist/control-center
          mapfile -t apks < <(find app/build/outputs/apk/debug -type f -name '*armeabi-v7a*.apk' -print)
          test "${#apks[@]}" -gt 0
          cp "${apks[@]}" dist/control-center/
          (cd dist/control-center && sha256sum *.apk) | tee dist/control-center/SHA256SUMS.txt
          printf '%s\n' \
            'schema=rafcodephi.control-center-build/v2' \
            "termux_packages_selector=$TERMUX_PACKAGES_SELECTOR" \
            "termux_packages_commit=$TERMUX_PACKAGES_SHA" \
            'device_abi_target=armeabi-v7a' \
            'bootstrap_arch=arm' \
            'package_name=com.termux.rafacodephi' \
            'prefix=/data/data/com.termux.rafacodephi/files/usr' \
            'package_runtime=real-pkg' \
            'apt_repository=DEVELOPMENT_REPOSITORY_CONFIGURED' \
            'apt_repository_url=https://raw.githubusercontent.com/rafaelmeloreisnovo/termux-packages/rafcodephi-apt-preview/repo' \
            'apt_repository_trust=GITHUB_HTTPS_TRANSPORT_ONLY' \
            'device_runtime_proof=TOKEN_VAZIO' \
            'claim_allowed_release=false' > dist/control-center/BUILD_RECEIPT.txt

      - name: Upload ARM32 install candidate + bootstrap evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: rafcodephi-control-center-arm32-${{ github.sha }}
          path: |
            dist/control-center
            build/reports/control-center-packages-pin-resolution.json
            termux-packages/artifacts/rafcodephi-bootstrap/rafcodephi-bootstrap-arm.zip
            termux-packages/artifacts/rafcodephi-bootstrap/RAFCODEPHI_REAL_BOOTSTRAP_MANIFEST.txt
          if-no-files-found: warn
