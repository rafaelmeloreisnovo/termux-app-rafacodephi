# ci_track: ops
# ci_abis: arm32,arm64
name: RafCodePhi Beta Build

on:
  push:
  workflow_dispatch:
    inputs:
      termux_packages_ref:
        description: Exact termux-packages commit/ref used to source-build the real bootstrap pair
        required: true
        type: string
        default: cd4b2aa019f0f33502e7c79264facac2d810f1cb
      build_apk_matrix:
        description: Build signed + unsigned APK matrix (arm32 + arm64)
        required: false
        type: boolean
        default: true
      run_bootstrap_baremetal_guard:
        description: Build and run bootstrap baremetal guard smoke
        required: false
        type: boolean
        default: true
      run_pss3_failure_audit:
        description: Run optional PSS3 failure audit
        required: false
        type: boolean
        default: true
      enforce_blocker_beta_gate:
        description: Fail when BLOCKER_BETA is detected in the PSS3 report
        required: false
        type: boolean
        default: true
      publish_matrix_summary:
        description: Publish APK matrix summary to the GitHub Actions summary
        required: false
        type: boolean
        default: true
      upload_beta_artifacts:
        description: Upload beta build artifacts
        required: false
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: rafcodephi-beta-real-${{ github.ref }}
  cancel-in-progress: true

env:
  TERMUX_PACKAGES_PIN: cd4b2aa019f0f33502e7c79264facac2d810f1cb
  CLAIM_ALLOWED: 'false'
  PHYSICAL_ANDROID: 'TOKEN_VAZIO'

jobs:
  beta-build:
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    env:
      SELECTED_TERMUX_PACKAGES_REF: ${{ github.event_name == 'workflow_dispatch' && inputs.termux_packages_ref || 'cd4b2aa019f0f33502e7c79264facac2d810f1cb' }}
    steps:
      - name: Checkout app
        uses: actions/checkout@v7
        with:
          persist-credentials: false
          fetch-depth: 1

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Bootstrap pair transaction regression selftest
        id: pair_transaction_selftest
        run: python3 scripts/test_bootstrap_pair_transaction.py

      # Immutable failover source for this run. It must not be overwritten until
      # the exact bootstrap consumed by the APK matrix has passed every core gate.
      - name: Restore last-known-good bootstrap pair
        id: restore_lkg_cache
        uses: actions/cache/restore@v6
        with:
          path: .ci-lkg/rafcodephi-bootstrap
          key: ${{ runner.os }}-rafcodephi-bootstrap-lkg-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-rafcodephi-bootstrap-lkg-

      - name: Validate restored LKG pair before eligibility
        id: validate_lkg
        shell: bash
        run: |
          set -euo pipefail
          root="$GITHUB_WORKSPACE/.ci-lkg/rafcodephi-bootstrap"
          arm="$root/rafcodephi-bootstrap-arm.zip"
          arm64="$root/rafcodephi-bootstrap-aarch64.zip"
          manifest="$root/RAFCODEPHI_REAL_BOOTSTRAP_MANIFEST.txt"
          if [[ ! -s "$arm" || ! -s "$arm64" || ! -s "$manifest" ]]; then
            echo 'state=TOKEN_VAZIO' >> "$GITHUB_OUTPUT"
            echo 'LKG bootstrap pair not available yet; primary path remains authoritative.'
            exit 0
          fi
          if python3 scripts/import_rafcodephi_real_bootstrap.py --arch arm --zip "$arm" --manifest "$manifest" --validate-only \
            && python3 scripts/import_rafcodephi_real_bootstrap.py --arch aarch64 --zip "$arm64" --manifest "$manifest" --validate-only; then
            echo 'state=READY' >> "$GITHUB_OUTPUT"
            echo "arm=$arm" >> "$GITHUB_OUTPUT"
            echo "aarch64=$arm64" >> "$GITHUB_OUTPUT"
            echo "manifest=$manifest" >> "$GITHUB_OUTPUT"
            sha256sum "$arm" "$arm64" "$manifest"
          else
            rm -rf "$root"
            echo 'state=INVALID_REJECTED' >> "$GITHUB_OUTPUT"
            echo 'Restored LKG failed strict validation and was rejected.'
          fi

      - name: Record manual beta build choices
        if: github.event_name == 'workflow_dispatch'
        run: |
          echo "## Beta build manual choices" >> "$GITHUB_STEP_SUMMARY"
          echo "| Option | Value |" >> "$GITHUB_STEP_SUMMARY"
          echo "|---|---|" >> "$GITHUB_STEP_SUMMARY"
          echo "| termux_packages_ref | ${{ inputs.termux_packages_ref }} |" >> "$GITHUB_STEP_SUMMARY"
          echo "| build_apk_matrix | ${{ inputs.build_apk_matrix }} |" >> "$GITHUB_STEP_SUMMARY"
          echo "| run_bootstrap_baremetal_guard | ${{ inputs.run_bootstrap_baremetal_guard }} |" >> "$GITHUB_STEP_SUMMARY"
          echo "| run_pss3_failure_audit | ${{ inputs.run_pss3_failure_audit }} |" >> "$GITHUB_STEP_SUMMARY"
          echo "| enforce_blocker_beta_gate | ${{ inputs.enforce_blocker_beta_gate }} |" >> "$GITHUB_STEP_SUMMARY"
          echo "| publish_matrix_summary | ${{ inputs.publish_matrix_summary }} |" >> "$GITHUB_STEP_SUMMARY"
          echo "| upload_beta_artifacts | ${{ inputs.upload_beta_artifacts }} |" >> "$GITHUB_STEP_SUMMARY"

      - name: Checkout pinned termux-packages source
        id: checkout_packages
        if: ${{ always() && (github.event_name != 'workflow_dispatch' || inputs.build_apk_matrix) }}
        continue-on-error: true
        uses: actions/checkout@v7
        with:
          repository: rafaelmeloreisnovo/termux-packages
          ref: ${{ env.SELECTED_TERMUX_PACKAGES_REF }}
          path: termux-packages
          persist-credentials: false
          fetch-depth: 1

      - name: Bind termux-packages identity and RAFCODEPhi build properties
        id: bind_packages
        if: ${{ always() && (github.event_name != 'workflow_dispatch' || inputs.build_apk_matrix) }}
        continue-on-error: true
        working-directory: termux-packages
        shell: bash
        run: |
          set -euo pipefail
          ACTUAL_SHA="$(git rev-parse HEAD)"
          test -n "$ACTUAL_SHA"
          if [[ "${GITHUB_EVENT_NAME}" != "workflow_dispatch" ]]; then
            test "$ACTUAL_SHA" = "$TERMUX_PACKAGES_PIN"
          fi
          mkdir -p build/reports
          python3 scripts/apply-rafcodephi-build-properties.py \
            --properties scripts/properties.sh \
            --receipt build/reports/rafcodephi-beta-properties.json
          bash scripts/validate-rafcodephi-build-properties.sh
          printf '%s\n' "$ACTUAL_SHA" > build/reports/rafcodephi-beta-termux-packages.commit
          sha256sum scripts/properties.sh > build/reports/rafcodephi-beta-properties.sha256

      - name: Source-build real ARM32 + ARM64 bootstrap pair
        id: build_real_bootstrap
        if: ${{ always() && (github.event_name != 'workflow_dispatch' || inputs.build_apk_matrix) }}
        continue-on-error: true
        working-directory: termux-packages
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build/reports
          chmod +x scripts/run-docker.sh scripts/build-rafcodephi-real-bootstrap.sh
          set +e
          ./scripts/run-docker.sh \
            ./scripts/build-rafcodephi-real-bootstrap.sh \
            --architectures arm,aarch64 \
            2>&1 | tee build/reports/rafcodephi-beta-real-bootstrap.log
          build_status="${PIPESTATUS[0]}"
          set -e
          python3 - "$build_status" > build/reports/rafcodephi-beta-real-bootstrap-status.json <<'PY'
          import json
          import sys
          status = int(sys.argv[1])
          print(json.dumps({
              "schema": "rafcodephi.beta-real-bootstrap-source-build/v1",
              "state": "PASS" if status == 0 else "BLOCKED",
              "exit_code": status,
              "claim_allowed_release": False,
              "device_runtime_proof": "TOKEN_VAZIO",
          }, sort_keys=True))
          PY
          if [[ "$build_status" -ne 0 ]]; then
            echo "RAFCODEPHI_BETA_REAL_BOOTSTRAP=BLOCKED exit_code=$build_status" >&2
            exit "$build_status"
          fi

      - name: Fail-closed gate real bootstrap pair
        id: gate_real_bootstrap
        if: ${{ always() && (github.event_name != 'workflow_dispatch' || inputs.build_apk_matrix) }}
        continue-on-error: true
        working-directory: termux-packages
        shell: bash
        run: |
          set -euo pipefail
          MANIFEST=artifacts/rafcodephi-bootstrap/RAFCODEPHI_REAL_BOOTSTRAP_MANIFEST.txt
          ARM=artifacts/rafcodephi-bootstrap/rafcodephi-bootstrap-arm.zip
          ARM64=artifacts/rafcodephi-bootstrap/rafcodephi-bootstrap-aarch64.zip
          test -s "$MANIFEST"
          test -s "$ARM"
          test -s "$ARM64"
          grep -Fx 'schema=rafcodephi.real-bootstrap-sourcebuild/v1' "$MANIFEST"
          grep -Fx 'package_name=com.termux.rafacodephi' "$MANIFEST"
          grep -Fx 'prefix=/data/data/com.termux.rafacodephi/files/usr' "$MANIFEST"
          grep -Fx 'bridge_allowed=false' "$MANIFEST"
          grep -Fx 'legacy_prefix_allowed=false' "$MANIFEST"
          grep -Fx 'claim_allowed_device_runtime=false' "$MANIFEST"
          grep -Fx 'device_runtime_proof=TOKEN_VAZIO' "$MANIFEST"
          sha256sum "$MANIFEST" "$ARM" "$ARM64" > build/reports/rafcodephi-beta-real-bootstrap.sha256

      - name: Resolve primary or validated LKG bootstrap pair
        id: resolve_bootstrap
        if: ${{ always() && (github.event_name != 'workflow_dispatch' || inputs.build_apk_matrix) }}
        shell: bash
        run: |
          set -euo pipefail
          primary="$GITHUB_WORKSPACE/termux-packages/artifacts/rafcodephi-bootstrap"
          if [[ "${{ steps.build_real_bootstrap.outcome }}" == success && "${{ steps.gate_real_bootstrap.outcome }}" == success \
                && -s "$primary/rafcodephi-bootstrap-arm.zip" \
                && -s "$primary/rafcodephi-bootstrap-aarch64.zip" \
                && -s "$primary/RAFCODEPHI_REAL_BOOTSTRAP_MANIFEST.txt" ]]; then
            echo 'state=PRIMARY' >> "$GITHUB_OUTPUT"
            echo "arm=$primary/rafcodephi-bootstrap-arm.zip" >> "$GITHUB_OUTPUT"
            echo "aarch64=$primary/rafcodephi-bootstrap-aarch64.zip" >> "$GITHUB_OUTPUT"
            echo "manifest=$primary/RAFCODEPHI_REAL_BOOTSTRAP_MANIFEST.txt" >> "$GITHUB_OUTPUT"
            echo 'Resolved source-built primary bootstrap pair.'
            exit 0
          fi
          if [[ "${{ steps.validate_lkg.outputs.state }}" == READY ]]; then
            echo 'state=FAILOVER_LKG' >> "$GITHUB_OUTPUT"
            echo "arm=${{ steps.validate_lkg.outputs.arm }}" >> "$GITHUB_OUTPUT"
            echo "aarch64=${{ steps.validate_lkg.outputs.aarch64 }}" >> "$GITHUB_OUTPUT"
            echo "manifest=${{ steps.validate_lkg.outputs.manifest }}" >> "$GITHUB_OUTPUT"
            echo 'Primary source build unavailable; resolved independently validated LKG pair.'
            exit 0
          fi
          echo 'state=BLOCKED' >> "$GITHUB_OUTPUT"
          echo 'No consumable primary or validated LKG bootstrap pair exists.' >&2
          exit 1

      - name: Setup Android SDK/NDK
        id: setup_android
        if: ${{ always() && (github.event_name != 'workflow_dispatch' || inputs.build_apk_matrix) }}
        continue-on-error: true
        run: ./scripts/setup_android_toolchain.sh

      - name: Prepare exact source-built real bootstrap hashes
        id: prepare_bootstrap
        if: ${{ always() && (github.event_name != 'workflow_dispatch' || inputs.build_apk_matrix) }}
        continue-on-error: true
        env:
          RAF_BOOTSTRAP_SOURCE: source-built-real
          RAF_REAL_BOOTSTRAP_ZIP_ARM: ${{ steps.resolve_bootstrap.outputs.arm }}
          RAF_REAL_BOOTSTRAP_ZIP_AARCH64: ${{ steps.resolve_bootstrap.outputs.aarch64 }}
          RAF_REAL_BOOTSTRAP_MANIFEST: ${{ steps.resolve_bootstrap.outputs.manifest }}
          RAF_BOOTSTRAP_LKG_ZIP_ARM: ${{ steps.resolve_bootstrap.outputs.state == 'PRIMARY' && steps.validate_lkg.outputs.arm || '' }}
          RAF_BOOTSTRAP_LKG_ZIP_AARCH64: ${{ steps.resolve_bootstrap.outputs.state == 'PRIMARY' && steps.validate_lkg.outputs.aarch64 || '' }}
          RAF_BOOTSTRAP_LKG_MANIFEST: ${{ steps.resolve_bootstrap.outputs.state == 'PRIMARY' && steps.validate_lkg.outputs.manifest || '' }}
        run: ./scripts/prepare_bootstrap_env.sh --github-env --skip-android-preflight

      - name: Assert embedded ARM profiles are real-pkg before APK build
        id: real_profile_gate
        if: ${{ always() && (github.event_name != 'workflow_dispatch' || inputs.build_apk_matrix) }}
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build/reports
          python3 tools/raf_bootstrap_profile.py inspect --zip app/src/main/cpp/rewritten-bootstrap-arm.zip > build/reports/beta-embedded-arm.json
          python3 tools/raf_bootstrap_profile.py inspect --zip app/src/main/cpp/rewritten-bootstrap-aarch64.zip > build/reports/beta-embedded-aarch64.json
          python3 - <<'PY'
          import json
          from pathlib import Path
          for arch in ('arm', 'aarch64'):
              doc = json.loads(Path(f'build/reports/beta-embedded-{arch}.json').read_text())
              profile = doc.get('profile_manifest') or {}
              if profile.get('profile') != 'real-pkg' or profile.get('package_layer') != 'real-pkg':
                  raise SystemExit(f'{arch}: beta requires real-pkg profile, got {profile}')
              classifications = doc.get('classifications') or {}
              for name in ('bin/apt', 'bin/apt-get'):
                  if classifications.get(name) != 'ELF':
                      raise SystemExit(f'{arch}: {name} is not ELF: {classifications.get(name)}')
          print('BETA_REAL_BOOTSTRAP_PROFILE_GATE=PASS')
          PY

      - name: Build signed + unsigned APK matrix (real bootstrap, arm32 + arm64)
        id: apk_matrix
        if: ${{ always() && (github.event_name != 'workflow_dispatch' || inputs.build_apk_matrix) }}
        continue-on-error: true
        env:
          RAF_BOOTSTRAP_SOURCE: source-built-real
          RAF_REAL_BOOTSTRAP_ZIP_ARM: ${{ steps.resolve_bootstrap.outputs.arm }}
          RAF_REAL_BOOTSTRAP_ZIP_AARCH64: ${{ steps.resolve_bootstrap.outputs.aarch64 }}
          RAF_REAL_BOOTSTRAP_MANIFEST: ${{ steps.resolve_bootstrap.outputs.manifest }}
          RAF_BOOTSTRAP_LKG_ZIP_ARM: ${{ steps.resolve_bootstrap.outputs.state == 'PRIMARY' && steps.validate_lkg.outputs.arm || '' }}
          RAF_BOOTSTRAP_LKG_ZIP_AARCH64: ${{ steps.resolve_bootstrap.outputs.state == 'PRIMARY' && steps.validate_lkg.outputs.aarch64 || '' }}
          RAF_BOOTSTRAP_LKG_MANIFEST: ${{ steps.resolve_bootstrap.outputs.state == 'PRIMARY' && steps.validate_lkg.outputs.manifest || '' }}
          RELEASE_TRACK: internal
          APK_MATRIX_UNIT_TESTS_REQUIRED: "true"
        run: ./scripts/build_apk_matrix.sh

      - name: Build bootstrap baremetal guard smoke
        id: build_guard
        if: ${{ always() && (github.event_name != 'workflow_dispatch' || inputs.run_bootstrap_baremetal_guard) }}
        continue-on-error: true
        run: |
          cc -O2 -Wall -Wextra -Iapp/src/main/cpp/lowlevel \
            tools/bootstrap_baremetal_guard_smoke.c \
            app/src/main/cpp/lowlevel/bootstrap_baremetal_guard.c \
            -o tools/bootstrap_baremetal_guard_smoke

      - name: Run bootstrap baremetal guard selftest (non-blocking)
        id: run_guard
        if: ${{ always() && (github.event_name != 'workflow_dispatch' || inputs.run_bootstrap_baremetal_guard) }}
        continue-on-error: true
        run: |
          mkdir -p out
          if [ -x tools/bootstrap_baremetal_guard_smoke ]; then
            tools/bootstrap_baremetal_guard_smoke | tee out/bootstrap_baremetal_guard_smoke.txt
          else
            echo 'TOKEN_VAZIO: bootstrap_baremetal_guard_smoke binary absent; selftest not executed' | tee out/bootstrap_baremetal_guard_smoke.txt
            exit 2
          fi

      - name: Build PSS3 failure lab tool
        id: build_pss3
        if: ${{ always() && (github.event_name != 'workflow_dispatch' || inputs.run_pss3_failure_audit) }}
        continue-on-error: true
        run: cc -O2 -Wall -Wextra -o tools/pss3_failure_lab tools/pss3_failure_lab.c

      - name: Run optional PSS3 failure audit
        id: run_pss3
        if: ${{ always() && (github.event_name != 'workflow_dispatch' || inputs.run_pss3_failure_audit) }}
        continue-on-error: true
        run: |
          mkdir -p out
          if [ ! -x tools/pss3_failure_lab ]; then
            echo 'TOKEN_VAZIO: pss3_failure_lab binary absent; audit not executed' | tee out/pss3_failure_report.txt
            exit 2
          elif [ -f out/failure_trace.csv ]; then
            printf '1\n2\n3\n5\n0\n' | tools/pss3_failure_lab out/failure_trace.csv | tee out/pss3_failure_report.txt
          else
            echo 'NO_FAILURE_TRACE: optional PSS3 audit has no failure trace to evaluate' | tee out/pss3_failure_report.txt
          fi

      - name: Enforce PSS3 BLOCKER_BETA only when evidence exists
        id: blocker_gate
        if: ${{ always() && (github.event_name != 'workflow_dispatch' || (inputs.run_pss3_failure_audit && inputs.enforce_blocker_beta_gate)) }}
        continue-on-error: true
        run: |
          set -euo pipefail
          report=out/pss3_failure_report.txt
          if [ ! -s "$report" ]; then
            echo 'NO_PSS3_REPORT: optional audit produced no report; no BLOCKER_BETA evidence exists'
            exit 0
          fi
          if grep -q 'TOKEN_VAZIO:' "$report"; then
            echo 'TOKEN_VAZIO: PSS3 tool execution was incomplete; blocker evidence is not claimable'
            exit 2
          fi
          if grep -q 'BLOCKER_BETA' "$report"; then
            echo 'BLOCKER_BETA detected in PSS3 report'
            exit 1
          fi
          echo 'PSS3_BLOCKER_BETA_GATE=PASS'

      # Derive the LKG from the final transaction produced by build_apk_matrix.sh,
      # because that script runs prepare_bootstrap_env.sh again immediately before
      # tests/assemble. This binds promotion to the bytes actually consumed by APK.
      - name: Promote bootstrap actually consumed by APK matrix
        id: promote_lkg
        if: ${{ always() && steps.prepare_bootstrap.outcome == 'success' && steps.real_profile_gate.outcome == 'success' && steps.apk_matrix.outcome == 'success' }}
        shell: bash
        env:
          RESOLUTION_STATE: ${{ steps.resolve_bootstrap.outputs.state }}
          RESOLVED_ARM: ${{ steps.resolve_bootstrap.outputs.arm }}
          RESOLVED_AARCH64: ${{ steps.resolve_bootstrap.outputs.aarch64 }}
          RESOLVED_MANIFEST: ${{ steps.resolve_bootstrap.outputs.manifest }}
          LKG_STATE: ${{ steps.validate_lkg.outputs.state }}
          LKG_ARM: ${{ steps.validate_lkg.outputs.arm }}
          LKG_AARCH64: ${{ steps.validate_lkg.outputs.aarch64 }}
          LKG_MANIFEST: ${{ steps.validate_lkg.outputs.manifest }}
        run: |
          set -euo pipefail
          report="$GITHUB_WORKSPACE/build/reports/bootstrap-pair-transaction.json"
          test -s "$report"
          tx_state="$(python3 - "$report" <<'PY'
          import json, sys
          state = json.load(open(sys.argv[1], encoding='utf-8')).get('state', '')
          if state not in {'PRIMARY_COMMITTED', 'FAILOVER_LKG'}:
              raise SystemExit(f'non-consumable transaction state: {state}')
          print(state)
          PY
          )"

          actual_mode=BLOCKED
          src_arm=''
          src_arm64=''
          src_manifest=''
          case "${RESOLUTION_STATE}:${tx_state}" in
            PRIMARY:PRIMARY_COMMITTED)
              actual_mode=PRIMARY
              src_arm="$RESOLVED_ARM"
              src_arm64="$RESOLVED_AARCH64"
              src_manifest="$RESOLVED_MANIFEST"
              ;;
            PRIMARY:FAILOVER_LKG)
              test "$LKG_STATE" = READY
              actual_mode=FAILOVER_LKG
              src_arm="$LKG_ARM"
              src_arm64="$LKG_AARCH64"
              src_manifest="$LKG_MANIFEST"
              ;;
            FAILOVER_LKG:PRIMARY_COMMITTED|FAILOVER_LKG:FAILOVER_LKG)
              actual_mode=FAILOVER_LKG
              src_arm="$RESOLVED_ARM"
              src_arm64="$RESOLVED_AARCH64"
              src_manifest="$RESOLVED_MANIFEST"
              ;;
            *)
              echo "Unsupported resolution/transaction combination: ${RESOLUTION_STATE}:${tx_state}" >&2
              exit 1
              ;;
          esac

          test -s "$src_arm"
          test -s "$src_arm64"
          test -s "$src_manifest"
          root="$GITHUB_WORKSPACE/.ci-lkg/rafcodephi-bootstrap"
          stage="$GITHUB_WORKSPACE/.ci-lkg/rafcodephi-bootstrap.stage"
          rm -rf "$stage"
          mkdir -p "$stage"
          cp "$src_arm" "$stage/rafcodephi-bootstrap-arm.zip"
          cp "$src_arm64" "$stage/rafcodephi-bootstrap-aarch64.zip"
          cp "$src_manifest" "$stage/RAFCODEPHI_REAL_BOOTSTRAP_MANIFEST.txt"
          python3 scripts/import_rafcodephi_real_bootstrap.py --arch arm \
            --zip "$stage/rafcodephi-bootstrap-arm.zip" \
            --manifest "$stage/RAFCODEPHI_REAL_BOOTSTRAP_MANIFEST.txt" --validate-only
          python3 scripts/import_rafcodephi_real_bootstrap.py --arch aarch64 \
            --zip "$stage/rafcodephi-bootstrap-aarch64.zip" \
            --manifest "$stage/RAFCODEPHI_REAL_BOOTSTRAP_MANIFEST.txt" --validate-only
          sha256sum \
            "$stage/rafcodephi-bootstrap-arm.zip" \
            "$stage/rafcodephi-bootstrap-aarch64.zip" \
            "$stage/RAFCODEPHI_REAL_BOOTSTRAP_MANIFEST.txt" > "$stage/SHA256SUMS"
          rm -rf "$root"
          mv "$stage" "$root"
          echo "mode=$actual_mode" >> "$GITHUB_OUTPUT"
          echo "transaction_state=$tx_state" >> "$GITHUB_OUTPUT"
          echo "PROMOTED_LKG_MODE=$actual_mode transaction=$tx_state"

      - name: Save next LKG cache
        id: save_lkg_cache
        if: ${{ always() && steps.promote_lkg.outcome == 'success' }}
        uses: actions/cache/save@v6
        with:
          path: .ci-lkg/rafcodephi-bootstrap
          key: ${{ runner.os }}-rafcodephi-bootstrap-lkg-${{ github.sha }}

      - name: Render beta operations dashboard
        id: publish_summary
        if: ${{ always() && (github.event_name != 'workflow_dispatch' || (inputs.build_apk_matrix && inputs.publish_matrix_summary)) }}
        continue-on-error: true
        env:
          BOOTSTRAP_RESOLUTION_STATE: ${{ steps.promote_lkg.outputs.mode || steps.resolve_bootstrap.outputs.state }}
          SETUP_ANDROID_OUTCOME: ${{ steps.setup_android.outcome }}
          PREPARE_BOOTSTRAP_OUTCOME: ${{ steps.prepare_bootstrap.outcome }}
          APK_MATRIX_OUTCOME: ${{ steps.apk_matrix.outcome }}
          BUILD_GUARD_OUTCOME: ${{ steps.build_guard.outcome }}
          RUN_GUARD_OUTCOME: ${{ steps.run_guard.outcome }}
          BUILD_PSS3_OUTCOME: ${{ steps.build_pss3.outcome }}
          RUN_PSS3_OUTCOME: ${{ steps.run_pss3.outcome }}
          BLOCKER_GATE_OUTCOME: ${{ steps.blocker_gate.outcome }}
          PUBLISH_SUMMARY_OUTCOME: success
          UPLOAD_ARTIFACTS_OUTCOME: pending
        run: |
          python3 scripts/render_beta_dashboard.py --out out/beta-dashboard.md --summary "$GITHUB_STEP_SUMMARY"
          {
            echo
            echo '## Real bootstrap beta contract'
            echo '- beta_bootstrap_source: source-built-real'
            echo "- pre_transaction_resolution: ${{ steps.resolve_bootstrap.outputs.state }}"
            echo "- apk_consumed_bootstrap_mode: ${{ steps.promote_lkg.outputs.mode }}"
            echo "- final_transaction_state: ${{ steps.promote_lkg.outputs.transaction_state }}"
            echo '- required_architectures: arm,aarch64'
            echo '- pair_transaction: rollback + validated-LKG-failover'
            echo '- lkg_replacement_order: after final APK-consumed transaction + real-pkg + APK matrix'
            echo '- bridge_allowed: false'
            echo '- physical_android: TOKEN_VAZIO'
            echo '- claim_allowed: false'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload beta artifacts, LKG bytes and bootstrap provenance
        id: upload_artifacts
        if: ${{ always() && (github.event_name != 'workflow_dispatch' || inputs.upload_beta_artifacts) }}
        continue-on-error: true
        uses: actions/upload-artifact@v7
        with:
          name: rafcodephi-beta-real-artifacts-${{ github.sha }}
          path: |
            dist/apk-matrix/**
            build/reports/beta-embedded-*.json
            build/reports/bootstrap-pair-transaction.json
            build/reports/rafcodephi-real-bootstrap-import-*.json
            build/reports/rafcodephi-real-bootstrap-import-matrix.json
            termux-packages/build/reports/rafcodephi-beta-*
            termux-packages/build/reports/rafcodephi-beta-real-bootstrap.log
            termux-packages/build/reports/rafcodephi-beta-real-bootstrap-status.json
            termux-packages/artifacts/rafcodephi-bootstrap/RAFCODEPHI_REAL_BOOTSTRAP_MANIFEST.txt
            termux-packages/artifacts/rafcodephi-bootstrap/rafcodephi-bootstrap-arm.zip
            termux-packages/artifacts/rafcodephi-bootstrap/rafcodephi-bootstrap-aarch64.zip
            .ci-lkg/rafcodephi-bootstrap/**
            docs/BETA_BUILD_REPORT.md
            docs/BETA_READINESS_REPORT.md
            out/beta-dashboard.md
            out/pss3_failure_report.txt
            out/bootstrap_baremetal_guard_smoke.txt
            docs/BETA_BOOTSTRAP_BAREMETAL_GUARD.md
            docs/BETA_BOOTSTRAP_BAREMETAL_STATUS.md
          if-no-files-found: warn

      - name: Final beta diagnostic gate
        if: ${{ always() }}
        env:
          PAIR_TRANSACTION_SELFTEST_OUTCOME: ${{ steps.pair_transaction_selftest.outcome }}
          CHECKOUT_PACKAGES_OUTCOME: ${{ steps.checkout_packages.outcome }}
          BIND_PACKAGES_OUTCOME: ${{ steps.bind_packages.outcome }}
          BUILD_REAL_BOOTSTRAP_OUTCOME: ${{ steps.build_real_bootstrap.outcome }}
          GATE_REAL_BOOTSTRAP_OUTCOME: ${{ steps.gate_real_bootstrap.outcome }}
          RESOLVE_BOOTSTRAP_OUTCOME: ${{ steps.resolve_bootstrap.outcome }}
          PRE_TRANSACTION_RESOLUTION_STATE: ${{ steps.resolve_bootstrap.outputs.state }}
          ACTUAL_BOOTSTRAP_MODE: ${{ steps.promote_lkg.outputs.mode }}
          FINAL_TRANSACTION_STATE: ${{ steps.promote_lkg.outputs.transaction_state }}
          SETUP_ANDROID_OUTCOME: ${{ steps.setup_android.outcome }}
          PREPARE_BOOTSTRAP_OUTCOME: ${{ steps.prepare_bootstrap.outcome }}
          REAL_PROFILE_GATE_OUTCOME: ${{ steps.real_profile_gate.outcome }}
          APK_MATRIX_OUTCOME: ${{ steps.apk_matrix.outcome }}
          BUILD_GUARD_OUTCOME: ${{ steps.build_guard.outcome }}
          RUN_GUARD_OUTCOME: ${{ steps.run_guard.outcome }}
          BUILD_PSS3_OUTCOME: ${{ steps.build_pss3.outcome }}
          RUN_PSS3_OUTCOME: ${{ steps.run_pss3.outcome }}
          BLOCKER_GATE_OUTCOME: ${{ steps.blocker_gate.outcome }}
          PROMOTE_LKG_OUTCOME: ${{ steps.promote_lkg.outcome }}
          SAVE_LKG_OUTCOME: ${{ steps.save_lkg_cache.outcome }}
          PUBLISH_SUMMARY_OUTCOME: ${{ steps.publish_summary.outcome }}
          UPLOAD_ARTIFACTS_OUTCOME: ${{ steps.upload_artifacts.outcome }}
        run: |
          status=0
          echo "## Final operational decision" >> "$GITHUB_STEP_SUMMARY"
          echo "| Stage | Policy | Outcome |" >> "$GITHUB_STEP_SUMMARY"
          echo "|---|---|---|" >> "$GITHUB_STEP_SUMMARY"

          check_step() {
            name="$1"
            outcome="$2"
            required="$3"
            echo "| ${name} | ${required} | ${outcome:-not-run} |" >> "$GITHUB_STEP_SUMMARY"
            if [ "$required" = "required" ]; then
              case "${outcome:-not-run}" in
                success) ;;
                *) status=1 ;;
              esac
            fi
          }

          check_step "pair_transaction_selftest" "$PAIR_TRANSACTION_SELFTEST_OUTCOME" "required"

          if [[ "${GITHUB_EVENT_NAME}" != "workflow_dispatch" || "${{ inputs.build_apk_matrix }}" == "true" ]]; then
            check_step "resolve_bootstrap" "$RESOLVE_BOOTSTRAP_OUTCOME" "required"
            case "$PRE_TRANSACTION_RESOLUTION_STATE" in
              PRIMARY)
                check_step "checkout_packages" "$CHECKOUT_PACKAGES_OUTCOME" "required"
                check_step "bind_packages" "$BIND_PACKAGES_OUTCOME" "required"
                check_step "build_real_bootstrap" "$BUILD_REAL_BOOTSTRAP_OUTCOME" "required"
                check_step "gate_real_bootstrap" "$GATE_REAL_BOOTSTRAP_OUTCOME" "required"
                ;;
              FAILOVER_LKG)
                check_step "checkout_packages" "$CHECKOUT_PACKAGES_OUTCOME" "degraded-optional"
                check_step "bind_packages" "$BIND_PACKAGES_OUTCOME" "degraded-optional"
                check_step "build_real_bootstrap" "$BUILD_REAL_BOOTSTRAP_OUTCOME" "degraded-optional"
                check_step "gate_real_bootstrap" "$GATE_REAL_BOOTSTRAP_OUTCOME" "degraded-optional"
                ;;
              *)
                echo "| pre_transaction_resolution_state | required | ${PRE_TRANSACTION_RESOLUTION_STATE:-not-run} |" >> "$GITHUB_STEP_SUMMARY"
                status=1
                ;;
            esac
            check_step "setup_android" "$SETUP_ANDROID_OUTCOME" "required"
            check_step "prepare_bootstrap" "$PREPARE_BOOTSTRAP_OUTCOME" "required"
            check_step "real_profile_gate" "$REAL_PROFILE_GATE_OUTCOME" "required"
            check_step "apk_matrix" "$APK_MATRIX_OUTCOME" "required"
            check_step "promote_lkg" "$PROMOTE_LKG_OUTCOME" "required"
            check_step "save_lkg_cache" "$SAVE_LKG_OUTCOME" "optional"
            case "$ACTUAL_BOOTSTRAP_MODE" in
              PRIMARY|FAILOVER_LKG) ;;
              *)
                echo "| apk_consumed_bootstrap_mode | required | ${ACTUAL_BOOTSTRAP_MODE:-not-run} |" >> "$GITHUB_STEP_SUMMARY"
                status=1
                ;;
            esac
          fi

          if [[ "${GITHUB_EVENT_NAME}" != "workflow_dispatch" || "${{ inputs.run_bootstrap_baremetal_guard }}" == "true" ]]; then
            check_step "build_guard" "$BUILD_GUARD_OUTCOME" "required"
            check_step "run_guard" "$RUN_GUARD_OUTCOME" "optional"
          else
            check_step "build_guard" "$BUILD_GUARD_OUTCOME" "disabled"
            check_step "run_guard" "$RUN_GUARD_OUTCOME" "disabled"
          fi

          if [[ "${GITHUB_EVENT_NAME}" != "workflow_dispatch" || "${{ inputs.run_pss3_failure_audit }}" == "true" ]]; then
            check_step "build_pss3" "$BUILD_PSS3_OUTCOME" "required"
            check_step "run_pss3" "$RUN_PSS3_OUTCOME" "optional"
            if [[ "${GITHUB_EVENT_NAME}" != "workflow_dispatch" || "${{ inputs.enforce_blocker_beta_gate }}" == "true" ]]; then
              check_step "blocker_gate" "$BLOCKER_GATE_OUTCOME" "required"
            else
              check_step "blocker_gate" "$BLOCKER_GATE_OUTCOME" "disabled"
            fi
          else
            check_step "build_pss3" "$BUILD_PSS3_OUTCOME" "disabled"
            check_step "run_pss3" "$RUN_PSS3_OUTCOME" "disabled"
            check_step "blocker_gate" "$BLOCKER_GATE_OUTCOME" "disabled"
          fi

          check_step "publish_summary" "$PUBLISH_SUMMARY_OUTCOME" "optional"
          check_step "upload_artifacts" "$UPLOAD_ARTIFACTS_OUTCOME" "optional"

          if [ "$status" -ne 0 ]; then
            echo "Beta build is BLOCKED: a required primary/LKG bootstrap or diagnostic gate did not pass."
            exit 1
          fi

          if [[ "$ACTUAL_BOOTSTRAP_MODE" == "FAILOVER_LKG" ]]; then
            echo "Operational decision: beta pipeline is GREEN_DEGRADED with the LKG pair actually consumed by APK matrix."
          else
            echo "Operational decision: beta pipeline is GREEN_PRIMARY with the source-built real pair actually consumed by APK matrix."
          fi
