name: Safety Gates CI

on:
  push:
    branches: [ master, claude/** ]
  pull_request:
    branches: [ master ]

jobs:
  safety-gates:
    name: Safety Cascade Gates
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Set up build environment
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y build-essential clang gcc-multilib

      - name: Syntax check (freestanding ARM64 — core modules)
        run: |
          echo "Checking freestanding C syntax (ARM64 target)..."
          clang -target aarch64-linux-gnu \
            -fsyntax-only -nostdlib -nostdinc -ffreestanding \
            -I rmr/Rrr -I rmr/include \
            rmr/Rrr/*.c rmr/Rrr/*.S 2>&1 || true
          echo "Syntax check attempted; this step is observational because failures are not promoted by this workflow."

      - name: Freestanding include-policy gate (lowlevel modules)
        run: |
          echo "=== Phase 2D: Validating lowlevel include policy ==="
          echo "Checking for non-freestanding includes in app/src/main/cpp/lowlevel/*.c..."

          # Check for stdlib.h, stdio.h, string.h, time.h, unistd.h, sys/*, pthread.h, math.h, assert.h
          NON_FREE=$(grep -l "^#include <stdlib.h>\|^#include <stdio.h>\|^#include <string.h>\|^#include <time.h>\|^#include <unistd.h>\|^#include <sys/\|^#include <pthread.h>\|^#include <math.h>\|^#include <assert.h>" app/src/main/cpp/lowlevel/*.c 2>/dev/null | wc -l)

          if [ "$NON_FREE" -eq 0 ]; then
            echo "PASS: zero forbidden lowlevel includes detected"
          else
            echo "FAIL: found $NON_FREE lowlevel files with forbidden includes"
            grep -l "^#include <stdlib.h>\|^#include <stdio.h>\|^#include <string.h>\|^#include <time.h>\|^#include <unistd.h>\|^#include <sys/\|^#include <pthread.h>\|^#include <math.h>\|^#include <assert.h>" app/src/main/cpp/lowlevel/*.c
            exit 1
          fi

          echo ""
          echo "Verifying freestanding wrapper header includes..."
          FS_USED=$(grep -l "freestanding_" app/src/main/cpp/lowlevel/*.c 2>/dev/null | wc -l)
          echo "  • Freestanding headers used in: $FS_USED files"

          echo ""
          echo "PASS: include policy only. This does not prove compilation, ABI correctness, runtime behavior, or physical-device execution."

      - name: Freestanding syscall header guard gate
        run: |
          grep -q '^#ifndef FREESTANDING_SYSCALLS_H$' src/bootstrap/freestanding_syscalls.h
          grep -q '^#define FREESTANDING_SYSCALLS_H$' src/bootstrap/freestanding_syscalls.h
          grep -q '^#endif /\* FREESTANDING_SYSCALLS_H \*/$' src/bootstrap/freestanding_syscalls.h
          echo "PASS: freestanding_syscalls.h has an explicit matched include guard"

      - name: BUG-01 Attractor Table Complete Gate
        run: |
          echo "Running: make attractor-table-complete-gate"
          cd /home/runner/work/termux-app-rafacodephi/termux-app-rafacodephi
          make attractor-table-complete-gate 2>&1 || echo "TOKEN_VAZIO: gate not promoted; environment-specific failure or unavailable prerequisite"

      - name: BUG-03 AArch64 Vectorpulse Gate
        run: |
          echo "Running: make aarch64-vectorpulse-gate"
          cd /home/runner/work/termux-app-rafacodephi/termux-app-rafacodephi
          make aarch64-vectorpulse-gate 2>&1 || echo "TOKEN_VAZIO: gate not promoted; environment-specific failure or unavailable prerequisite"

      - name: BUG-08 Lyapunov Convergence Gate
        run: |
          echo "Running: make lyapunov-convergence-gate"
          cd /home/runner/work/termux-app-rafacodephi/termux-app-rafacodephi
          make lyapunov-convergence-gate 2>&1 || echo "TOKEN_VAZIO: gate not promoted; environment-specific failure or unavailable prerequisite"

      - name: BUG-06 CtiScanner Race Condition Gate
        run: |
          echo "Running: make cti-race-condition-gate"
          cd /home/runner/work/termux-app-rafacodephi/termux-app-rafacodephi
          make cti-race-condition-gate 2>&1 || echo "TOKEN_VAZIO: gate not promoted; environment-specific failure or unavailable prerequisite"

      - name: Validate documentation structure
        run: |
          echo "Checking critical documentation files..."
          test -f docs/00_BUG_MASTER_INDEX.md && echo "✓ Bug master index found"
          test -f docs/SAFETY_CASCADE_COMPLETION.md && echo "✓ Cascade completion doc found"
          test -f docs/F_GAP_CLOSURE_ROADMAP.md && echo "✓ F_gap roadmap found"
          test -f AGENTS.md && echo "✓ AGENTS.md found"
          test -f CLAUDE.md && echo "✓ CLAUDE.md found"

      - name: Report gate status
        if: always()
        run: |
          echo ""
          echo "╔═══════════════════════════════════════════════════════════╗"
          echo "║              SAFETY CASCADE CI REPORT                    ║"
          echo "╠═══════════════════════════════════════════════════════════╣"
          echo "║ Scope: structural/include-policy checks + gate attempts  ║"
          echo "║                                                           ║"
          echo "║ Truth boundary:                                           ║"
          echo "║   • include-policy PASS != compile PASS                   ║"
          echo "║   • attempted gate != resolved bug                        ║"
          echo "║   • CI observation != physical Android runtime           ║"
          echo "║   • swallowed/env-dependent failure = TOKEN_VAZIO        ║"
          echo "║                                                           ║"
          echo "║ Device validation remains a separate evidence gate.      ║"
          echo "╚═══════════════════════════════════════════════════════════╝"
