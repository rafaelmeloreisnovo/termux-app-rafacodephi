# ci_track: ops
# ci_abis: armeabi-v7a,arm64-v8a
name: "🧭 RAFCODEΦ — Control Plane Canônico"

run-name: "RAFCODEΦ / ${{ github.event_name }} / ${{ github.ref_name }}"

on:
  workflow_dispatch:
    inputs:
      mission:
        description: "O que você quer fazer?"
        required: true
        default: diagnostico
        type: choice
        options:
          - diagnostico
          - arm32-v7
          - bootstrap-arm32
          - evidencias
          - e2e-proof
          - completo-seguro
      ndk_lane:
        description: "ARM32: toolchain"
        required: true
        default: canonical
        type: choice
        options:
          - canonical
          - ndk29
      strict_governance:
        description: "Falhar se workflow antigo ainda estiver sem metadados?"
        required: true
        default: false
        type: boolean
  pull_request:
    paths:
      - '.github/workflows/**'
      - '.github/actions/**'
      - 'scripts/ci/workflow_control_plane.py'
      - 'scripts/validate_ci_workflow_metadata.sh'
      - 'scripts/audit_github_actions_refs.py'
      - 'scripts/validate_abi_policy_consistency.sh'
      - 'scripts/federation/collect_runtime_evidence.sh'
      - 'tools/validate_runtime_evidence.py'
      - 'tools/audit_freestanding_boundaries.py'
      - 'configs/freestanding-pure-core.v1.json'
      - 'rafaelia/src/main/cpp/zero/**'
      - 'tests/pure_core_probe.c'
      - 'docs/FREESTANDING_PURE_CORE_INVENTORY_V2.md'
      - 'tests/test_rafcodephi_startup_and_settings_contract.py'
      - 'tests/test_workflow_control_plane_contract.py'
      - 'docs/CI_WORKFLOW_OWNERSHIP.md'
      - 'docs/WORKFLOW_CONTROL_PLANE.md'
  push:
    branches: [master]
    paths:
      - '.github/workflows/**'
      - '.github/actions/**'
      - 'scripts/ci/workflow_control_plane.py'
      - 'scripts/validate_ci_workflow_metadata.sh'
      - 'scripts/audit_github_actions_refs.py'
      - 'scripts/validate_abi_policy_consistency.sh'
      - 'scripts/federation/collect_runtime_evidence.sh'
      - 'tools/validate_runtime_evidence.py'
      - 'tools/audit_freestanding_boundaries.py'
      - 'configs/freestanding-pure-core.v1.json'
      - 'rafaelia/src/main/cpp/zero/**'
      - 'tests/pure_core_probe.c'
      - 'docs/FREESTANDING_PURE_CORE_INVENTORY_V2.md'
      - 'tests/test_rafcodephi_startup_and_settings_contract.py'
      - 'tests/test_workflow_control_plane_contract.py'
      - 'docs/CI_WORKFLOW_OWNERSHIP.md'
      - 'docs/WORKFLOW_CONTROL_PLANE.md'

permissions:
  contents: read

env:
  ORCHESTRATOR_SCHEMA: 'rafaelia.rafcodephi-control-plane/v2'
  CLAIM_ALLOWED: 'false'
  RELEASE_ALLOWED: 'false'
  PHYSICAL_ANDROID: 'TOKEN_VAZIO'

concurrency:
  group: rafaelia-control-plane-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  inventory:
    name: "🧭 1/6 Inventário + plano + governança"
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Explicar rota escolhida
        run: |
          {
            echo '## 🧭 RAFAELIA Control Plane'
            echo
            echo "**Evento:** $GITHUB_EVENT_NAME"
            if [[ "$GITHUB_EVENT_NAME" == "workflow_dispatch" ]]; then
              echo "**Objetivo:** \`${{ inputs.mission }}\`"
              echo "**ARM32 toolchain:** \`${{ inputs.ndk_lane }}\`"
              echo "**Governança estrita:** \`${{ inputs.strict_governance }}\`"
            else
              echo '**Modo:** governança automática — nenhum build pesado é iniciado por este workflow.'
            fi
            echo
            echo '> Um botão escolhe a intenção; os workflows especialistas continuam auditáveis e isolados.'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Inventário governado de todos os YML
        run: |
          set -euo pipefail
          args=()
          if [[ "$GITHUB_EVENT_NAME" == "workflow_dispatch" && "${{ inputs.strict_governance }}" == "true" ]]; then
            args+=(--strict)
          fi
          python3 scripts/ci/workflow_control_plane.py "${args[@]}"
          cat reports/workflow-control-plane.md >> "$GITHUB_STEP_SUMMARY"

      - name: Auditar referências de GitHub Actions
        env:
          STRICT_GOVERNANCE: ${{ github.event_name == 'workflow_dispatch' && inputs.strict_governance || false }}
        run: |
          set -euo pipefail
          mkdir -p reports
          args=(--json reports/action-reference-audit.json)
          if [[ "${STRICT_GOVERNANCE}" == "true" ]]; then
            args+=(--strict)
          fi
          python3 scripts/audit_github_actions_refs.py "${args[@]}"

      - name: Contratos estáticos do control plane
        run: python3 tests/test_workflow_control_plane_contract.py

      - name: Validar metadados legados em modo compatível
        env:
          CI_METADATA_STRICT: '0'
        run: ./scripts/validate_ci_workflow_metadata.sh

      - name: Publicar inventário
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: workflow-control-plane-${{ github.sha }}
          if-no-files-found: error
          retention-days: 14
          path: |
            reports/workflow-control-plane.json
            reports/workflow-control-plane.md
            reports/action-reference-audit.json

  policy-contracts:
    name: "🧪 2/6 Fonte + ABI + runtime read-only"
    needs: inventory
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout imutável
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          fetch-depth: 1

      - name: ABI policy consistency
        run: ./scripts/validate_abi_policy_consistency.sh

      - name: Freestanding pure-core boundary
        run: |
          set -euo pipefail
          python3 tools/audit_freestanding_boundaries.py \
            --strict --compile-probe --write-report

      - name: RAFAELIA ZERO compatibility contract
        run: python3 scripts/validate_rafaelia_zero_runtime.py

      - name: Settings / capability / startup contract
        run: python3 tests/test_rafcodephi_startup_and_settings_contract.py

      - name: Runtime evidence collector — read-only contract
        run: |
          set -euo pipefail
          sh -n scripts/federation/collect_runtime_evidence.sh
          mkdir -p artifacts
          sh scripts/federation/collect_runtime_evidence.sh artifacts/termux-runtime-evidence.json
          python3 tools/validate_runtime_evidence.py artifacts/termux-runtime-evidence.json
          python3 - <<'PY'
          import json
          from pathlib import Path
          report = json.loads(Path('artifacts/termux-runtime-evidence.json').read_text())
          assert report['claim_allowed'] is False
          assert report['install_or_mutation_performed'] is False
          print('RUNTIME_EVIDENCE_CONTRACT=PASS')
          PY

      - name: Publicar contrato runtime
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: rafcodephi-runtime-contract-${{ github.run_id }}-${{ github.run_attempt }}
          if-no-files-found: error
          retention-days: 30
          path: |
            artifacts/termux-runtime-evidence.json
            reports/freestanding-boundary-inventory.json
            reports/freestanding-boundary-inventory.md

  tests:
    name: "🧪 2/6 Testes de software"
    if: github.event_name == 'workflow_dispatch' && (inputs.mission == 'diagnostico' || inputs.mission == 'completo-seguro')
    needs:
      - inventory
      - policy-contracts
    uses: ./.github/workflows/run_tests.yml
    secrets: inherit

  arm32-canonical:
    name: "📱 3/6 ARM32 v7 canônico"
    if: github.event_name == 'workflow_dispatch' && inputs.ndk_lane == 'canonical' && (inputs.mission == 'arm32-v7' || inputs.mission == 'bootstrap-arm32' || inputs.mission == 'completo-seguro')
    needs:
      - inventory
      - policy-contracts
    uses: ./.github/workflows/compatibility-arm32.yml
    secrets: inherit

  arm32-ndk29:
    name: "📱 3/6 ARM32 v7 NDK29"
    if: github.event_name == 'workflow_dispatch' && inputs.ndk_lane == 'ndk29' && (inputs.mission == 'arm32-v7' || inputs.mission == 'bootstrap-arm32' || inputs.mission == 'completo-seguro')
    needs:
      - inventory
      - policy-contracts
    uses: ./.github/workflows/compatibility-arm32-ndk29.yml
    secrets: inherit

  bootstrap-contract:
    name: "🧱 4/6 Contrato de bootstrap"
    if: github.event_name == 'workflow_dispatch' && (inputs.mission == 'bootstrap-arm32' || inputs.mission == 'completo-seguro')
    needs:
      - inventory
      - policy-contracts
    uses: ./.github/workflows/beta-real-bootstrap-contract.yml
    secrets: inherit

  evidence-contract:
    name: "🧾 5/6 Gate de evidência APK"
    if: github.event_name == 'workflow_dispatch' && (inputs.mission == 'bootstrap-arm32' || inputs.mission == 'evidencias' || inputs.mission == 'completo-seguro')
    needs:
      - inventory
      - policy-contracts
    uses: ./.github/workflows/apk-evidence-gate.yml
    secrets: inherit

  e2e-proof-contract:
    name: "🔗 5/6 E2E product proof — sem claim físico"
    if: github.event_name == 'workflow_dispatch' && (inputs.mission == 'evidencias' || inputs.mission == 'e2e-proof' || inputs.mission == 'completo-seguro')
    needs:
      - inventory
      - policy-contracts
    uses: ./.github/workflows/rafaelia_e2e_product_proof.yml
    with:
      torre_correlation_id: ${{ format('gh-{0}-{1}', github.run_id, github.run_attempt) }}
    secrets: inherit

  omega-summary:
    name: "Ω 6/6 Resultado simples"
    if: always()
    needs:
      - inventory
      - policy-contracts
      - tests
      - arm32-canonical
      - arm32-ndk29
      - bootstrap-contract
      - evidence-contract
      - e2e-proof-contract
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Resumo para humano
        env:
          INVENTORY: ${{ needs.inventory.result }}
          POLICY: ${{ needs.policy-contracts.result }}
          TESTS: ${{ needs.tests.result }}
          ARM32_CANONICAL: ${{ needs.arm32-canonical.result }}
          ARM32_NDK29: ${{ needs.arm32-ndk29.result }}
          BOOTSTRAP: ${{ needs.bootstrap-contract.result }}
          EVIDENCE: ${{ needs.evidence-contract.result }}
          E2E: ${{ needs.e2e-proof-contract.result }}
          MISSION: ${{ inputs.mission }}
          NDK_LANE: ${{ inputs.ndk_lane }}
        run: |
          set -euo pipefail
          mission="${MISSION:-automatic-governance}"
          ndk="${NDK_LANE:-n/a}"
          {
            echo '# Ω Resultado RAFAELIA'
            echo
            echo "- Objetivo: \`$mission\`"
            echo "- Toolchain ARM32: \`$ndk\`"
            echo "- Inventário: **$INVENTORY**"
            echo "- Fonte/ABI/runtime contract: **$POLICY**"
            echo "- Testes: **$TESTS**"
            echo "- ARM32 canônico: **$ARM32_CANONICAL**"
            echo "- ARM32 NDK29: **$ARM32_NDK29**"
            echo "- Bootstrap: **$BOOTSTRAP**"
            echo "- Evidência APK: **$EVIDENCE**"
            echo "- E2E proof contract: **$E2E**"
            echo
            echo '### Como ler'
            echo '- `success` = a etapa executada passou.'
            echo '- `skipped` = não fazia parte da opção escolhida.'
            echo '- `failure` = existe uma pendência real; abra somente a etapa vermelha.'
            echo
            echo '> CI PASS não substitui recibo físico Android. `device_runtime_proof` permanece TOKEN_VAZIO até execução no aparelho.'
            echo '> Vectras/IPC/provider e benchmarks físicos permanecem especialistas até possuírem `workflow_call` canônico.'
          } >> "$GITHUB_STEP_SUMMARY"

          [[ "$INVENTORY" == "success" ]] || exit 1
          [[ "$POLICY" == "success" ]] || exit 1

          if [[ "$GITHUB_EVENT_NAME" != "workflow_dispatch" ]]; then
            exit 0
          fi

          case "$mission" in
            diagnostico)
              [[ "$TESTS" == "success" ]] || exit 1
              ;;
            arm32-v7)
              if [[ "$ndk" == "canonical" ]]; then
                [[ "$ARM32_CANONICAL" == "success" ]] || exit 1
              else
                [[ "$ARM32_NDK29" == "success" ]] || exit 1
              fi
              ;;
            bootstrap-arm32)
              if [[ "$ndk" == "canonical" ]]; then
                [[ "$ARM32_CANONICAL" == "success" ]] || exit 1
              else
                [[ "$ARM32_NDK29" == "success" ]] || exit 1
              fi
              [[ "$BOOTSTRAP" == "success" ]] || exit 1
              [[ "$EVIDENCE" == "success" ]] || exit 1
              ;;
            evidencias)
              [[ "$EVIDENCE" == "success" ]] || exit 1
              [[ "$E2E" == "success" ]] || exit 1
              ;;
            e2e-proof)
              [[ "$E2E" == "success" ]] || exit 1
              ;;
            completo-seguro)
              [[ "$TESTS" == "success" ]] || exit 1
              if [[ "$ndk" == "canonical" ]]; then
                [[ "$ARM32_CANONICAL" == "success" ]] || exit 1
              else
                [[ "$ARM32_NDK29" == "success" ]] || exit 1
              fi
              [[ "$BOOTSTRAP" == "success" ]] || exit 1
              [[ "$EVIDENCE" == "success" ]] || exit 1
              [[ "$E2E" == "success" ]] || exit 1
              ;;
            *)
              echo "Unsupported mission=$mission" >&2
              exit 2
              ;;
          esac

      - name: Emitir receipt final do orquestrador
        if: always()
        env:
          INVENTORY: ${{ needs.inventory.result }}
          POLICY: ${{ needs.policy-contracts.result }}
          TESTS: ${{ needs.tests.result }}
          ARM32_CANONICAL: ${{ needs.arm32-canonical.result }}
          ARM32_NDK29: ${{ needs.arm32-ndk29.result }}
          BOOTSTRAP: ${{ needs.bootstrap-contract.result }}
          EVIDENCE: ${{ needs.evidence-contract.result }}
          E2E: ${{ needs.e2e-proof-contract.result }}
        run: |
          set -euo pipefail
          mkdir -p reports
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path
          payload = {
              'schema': os.environ['ORCHESTRATOR_SCHEMA'],
              'state': 'OBSERVED',
              'repository': os.environ['GITHUB_REPOSITORY'],
              'sha': os.environ['GITHUB_SHA'],
              'run_id': os.environ['GITHUB_RUN_ID'],
              'run_attempt': os.environ['GITHUB_RUN_ATTEMPT'],
              'results': {
                  'inventory': os.environ['INVENTORY'],
                  'policy_contracts': os.environ['POLICY'],
                  'tests': os.environ['TESTS'],
                  'arm32_canonical': os.environ['ARM32_CANONICAL'],
                  'arm32_ndk29': os.environ['ARM32_NDK29'],
                  'bootstrap_contract': os.environ['BOOTSTRAP'],
                  'apk_evidence_contract': os.environ['EVIDENCE'],
                  'e2e_proof_contract': os.environ['E2E'],
              },
              'claim_allowed': False,
              'release_allowed': False,
              'physical_android': 'TOKEN_VAZIO',
              'source_artifact_execution_evidence_claim_separated': True,
              'specialists_not_promoted': [
                  'vectras_ipc_provider',
                  'physical_benchmarks',
                  'physical_android_runtime',
              ],
          }
          Path('reports/rafcodephi-orchestrator-receipt.json').write_text(
              json.dumps(payload, indent=2, sort_keys=True) + '\n',
              encoding='utf-8',
          )
          PY

      - name: Publicar receipt final
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: rafcodephi-orchestrator-receipt-${{ github.run_id }}-${{ github.run_attempt }}
          if-no-files-found: error
          retention-days: 30
          path: reports/rafcodephi-orchestrator-receipt.json
