# ci_track: ops
# ci_abis: n/a
name: Vectra-grade Benchmarks

on:
  workflow_call:
  workflow_dispatch:
  push:
    branches:
      - master
    paths:
      - 'app/**'
      - 'rmr/**'
      - 'rafaelia/**'
      - 'scripts/**'
      - 'tests/test_industrial_benchmark_v3_contract.py'
      - 'tests/test_beta_orchestrator_contract.py'
      - 'docs/VECTRA_GRADE_BENCHMARKS.md'
      - 'docs/benchmark/**'
      - 'DOCS_L2_TREE.md'
      - '.github/workflows/vectra-grade-benchmarks.yml'
      - '.github/workflows/00_START_HERE.yml'
  pull_request:
    branches:
      - master
    paths:
      - 'app/**'
      - 'rmr/**'
      - 'rafaelia/**'
      - 'scripts/**'
      - 'tests/test_industrial_benchmark_v3_contract.py'
      - 'tests/test_beta_orchestrator_contract.py'
      - 'docs/VECTRA_GRADE_BENCHMARKS.md'
      - 'docs/benchmark/**'
      - 'DOCS_L2_TREE.md'
      - '.github/workflows/vectra-grade-benchmarks.yml'
      - '.github/workflows/00_START_HERE.yml'

permissions:
  contents: read

concurrency:
  group: vectra-grade-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  CLAIM_ALLOWED: 'false'
  PA_PHYSICAL_EXECUTION: 'TOKEN_VAZIO'

jobs:
  vectra-grade-benchmarks:
    name: Generate industrial benchmark artifacts
    runs-on: ubuntu-24.04
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up JDK
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - name: Prepare Android toolchain
        id: toolchain
        run: |
          chmod +x ./scripts/ci_android_preflight.sh || true
          ./scripts/ci_android_preflight.sh

      - name: Install benchmark contract test dependency
        run: python3 -m pip install --disable-pip-version-check pytest

      - name: Validate industrial benchmark V3 + beta orchestrator contracts
        id: contracts
        run: |
          python3 -m pytest -q \
            tests/test_industrial_benchmark_v3_contract.py \
            tests/test_beta_orchestrator_contract.py

      - name: Build debug APK
        id: build
        run: |
          chmod +x ./gradlew
          eval "$(./scripts/prepare_bootstrap_env.sh --print-env)"
          ./gradlew :app:testDebugUnitTest :app:assembleDebug --no-daemon

      - name: Generate Vectra-grade diagnostic artifacts
        id: artifacts
        if: always()
        run: |
          chmod +x ./scripts/run_vectra_grade_benchmarks.sh
          ./scripts/run_vectra_grade_benchmarks.sh

      - name: Emit CI evidence envelope
        if: always()
        env:
          TOOLCHAIN_OUTCOME: ${{ steps.toolchain.outcome }}
          CONTRACT_OUTCOME: ${{ steps.contracts.outcome }}
          BUILD_OUTCOME: ${{ steps.build.outcome }}
          ARTIFACT_OUTCOME: ${{ steps.artifacts.outcome }}
        run: |
          set -euo pipefail
          mkdir -p dist/vectra-benchmarks
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          observed = {
              "toolchain": os.environ.get("TOOLCHAIN_OUTCOME") or "not_run",
              "contracts": os.environ.get("CONTRACT_OUTCOME") or "not_run",
              "build": os.environ.get("BUILD_OUTCOME") or "not_run",
              "artifact_generation": os.environ.get("ARTIFACT_OUTCOME") or "not_run",
          }
          required = ("toolchain", "contracts", "build", "artifact_generation")
          gate = "PASS" if all(observed[name] == "success" for name in required) else "FAIL"
          payload = {
              "schema": "rafaelia.vectra-ci-evidence-envelope/v1",
              "gate": gate,
              "repository": os.environ["GITHUB_REPOSITORY"],
              "sha": os.environ["GITHUB_SHA"],
              "run_id": os.environ["GITHUB_RUN_ID"],
              "run_attempt": os.environ["GITHUB_RUN_ATTEMPT"],
              "observed": observed,
              "claim_allowed": False,
              "pa_physical_execution": "TOKEN_VAZIO",
              "energy_validity": "TOKEN_VAZIO",
              "cross_device_comparability": "TOKEN_VAZIO",
              "boundary": "CI artifacts != PA physical device measurement",
          }
          Path("dist/vectra-benchmarks/CI_EVIDENCE_ENVELOPE.json").write_text(
              json.dumps(payload, indent=2, sort_keys=True) + "\n",
              encoding="utf-8",
          )
          print(f"VECTRA_CI_GATE={gate}")
          PY

      - name: Upload Vectra-grade benchmark artifacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: vectra-grade-benchmarks-${{ github.sha }}
          path: dist/vectra-benchmarks/
          if-no-files-found: error
