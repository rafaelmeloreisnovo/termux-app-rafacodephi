name: Vectras Termux Provider v3

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'app/build.gradle'
      - 'app/src/main/AndroidManifest.xml'
      - 'app/src/main/java/com/termux/app/RunCommandService.java'
      - 'termux-shared/src/main/java/com/termux/shared/termux/TermuxConstants.java'
      - 'termux-shared/src/main/java/com/termux/shared/shell/command/ExecutionCommand.java'
      - 'termux-shared/src/main/java/com/termux/shared/termux/plugins/TermuxPluginUtils.java'
      - 'termux-shared/src/main/java/com/termux/shared/shell/command/result/ResultSender.java'
      - 'docs/contracts/VECTRAS_TERMUX_PROVIDER_V3.json'
      - 'docs/contracts/VECTRAS_TERMUX_PROVIDER_V3.md'
      - 'scripts/verify_vectras_termux_provider_v3.py'
      - '.github/workflows/vectras-termux-provider-v3.yml'

permissions:
  contents: read

concurrency:
  group: vectras-termux-provider-v3-${{ github.ref }}
  cancel-in-progress: true

jobs:
  provider-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout exact revision
        uses: actions/checkout@v7

      - name: Python syntax
        run: python3 -m py_compile scripts/verify_vectras_termux_provider_v3.py

      - name: Verify provider contract
        run: |
          python3 scripts/verify_vectras_termux_provider_v3.py \
            --output artifacts/c07/termux-provider-v3.json

      - name: Verify claim boundary
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path

          contract = json.loads(Path('docs/contracts/VECTRAS_TERMUX_PROVIDER_V3.json').read_text())
          report = json.loads(Path('artifacts/c07/termux-provider-v3.json').read_text())
          assert contract['schema'] == 'raf.termux-run-command-provider.v3'
          assert contract['claim_allowed'] is False
          assert report['state'] == 'PASS_STATIC_PROVIDER_CONTRACT'
          assert report['claim_allowed'] is False
          assert report['runtime_boundary']['real_result_bundle'] == 'TOKEN_VAZIO'
          assert report['runtime_boundary']['guest_boot'] == 'TOKEN_VAZIO'
          print('PASS Termux provider v3 static boundary')
          PY

      - name: Upload provider receipt
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: termux-run-command-provider-v3-${{ github.sha }}
          path: artifacts/c07/
          if-no-files-found: error
          retention-days: 30
