name: RAFCODEPHI Workflow Syntax Gate

on:
  workflow_dispatch:
  pull_request:
    paths:
      - '.github/workflows/**'
      - 'tests/test_github_workflow_syntax.py'
  push:
    branches: [master]
    paths:
      - '.github/workflows/**'
      - 'tests/test_github_workflow_syntax.py'

permissions:
  contents: read

concurrency:
  group: rafcodephi-workflow-syntax-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  syntax:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout exact revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          fetch-depth: 1

      - name: Install YAML parser
        shell: bash
        run: python3 -m pip install --disable-pip-version-check --quiet pyyaml

      - name: Parse all workflows and embedded Bash
        shell: bash
        run: python3 tests/test_github_workflow_syntax.py
