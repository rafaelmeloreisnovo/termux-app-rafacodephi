name: RAFCODEPHI Service Provenance Snapshot

on:
  pull_request:
    paths:
      - 'app/build.gradle'
      - 'app/src/main/AndroidManifest.xml'
      - 'app/src/main/java/com/termux/app/TermuxService.java'
      - 'app/src/main/java/com/termux/app/RunCommandService.java'
      - 'docs/audits/TERMINAL_SERVICE_BOOTSTRAP_GAP.md'
      - 'docs/contracts/VECTRAS_TERMUX_PROVIDER_V3.md'
      - 'docs/assurance/RAFCODEPHI_SERVICE_PROVENANCE_RECEIPT_20260901.v1.json'
      - 'docs/assurance/RAFCODEPHI_SERVICE_DEPENDENCY_GRAPH_20260901.v1.json'
      - 'scripts/verify_vectras_termux_provider_v3.py'
      - 'tools/validate_terminal_service_bootstrap_gap.py'
      - 'tools/validate_rafcodephi_service_provenance_receipt.py'
      - '.github/workflows/rafcodephi-service-provenance-snapshot.yml'
  push:
    branches: [master]
    paths:
      - 'app/build.gradle'
      - 'app/src/main/AndroidManifest.xml'
      - 'app/src/main/java/com/termux/app/TermuxService.java'
      - 'app/src/main/java/com/termux/app/RunCommandService.java'
      - 'docs/audits/TERMINAL_SERVICE_BOOTSTRAP_GAP.md'
      - 'docs/contracts/VECTRAS_TERMUX_PROVIDER_V3.md'
      - 'docs/assurance/RAFCODEPHI_SERVICE_PROVENANCE_RECEIPT_20260901.v1.json'
      - 'docs/assurance/RAFCODEPHI_SERVICE_DEPENDENCY_GRAPH_20260901.v1.json'
      - 'scripts/verify_vectras_termux_provider_v3.py'
      - 'tools/validate_terminal_service_bootstrap_gap.py'
      - 'tools/validate_rafcodephi_service_provenance_receipt.py'
      - '.github/workflows/rafcodephi-service-provenance-snapshot.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  snapshot-consistency:
    name: service-provenance-snapshot
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout exact revision and immutable historic source
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Validate receipt schema and source bindings
        run: |
          python3 -m py_compile tools/validate_rafcodephi_service_provenance_receipt.py
          # Archived snapshot is verified at the exact recorded Git commit/tree.
          python3 tools/validate_rafcodephi_service_provenance_receipt.py --verify-archived-source --self-test

      - name: Validate dependency graph
        run: |
          python3 tools/validate_cross_domain_dependency_graph.py \
            docs/assurance/RAFCODEPHI_SERVICE_DEPENDENCY_GRAPH_20260901.v1.json

      - name: Validate static bootstrap guard
        run: python3 tools/validate_terminal_service_bootstrap_gap.py

      - name: Validate current Vectras contract independently of archived evidence
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/verify_vectras_termux_provider_v3.py --output "$RUNNER_TEMP/vectras-provider.json"
          python3 - "$RUNNER_TEMP/vectras-provider.json" <<'PY'
          import json
          import sys
          from pathlib import Path
          data = json.loads(Path(sys.argv[1]).read_text(encoding="utf-8"))
          assert data["state"] == "PASS_STATIC_PROVIDER_CONTRACT", data["errors"]
          assert data["claim_allowed"] is False
          assert data["provider_package"] == "com.termux.rafacodephi"
          assert data["checks"] and all(data["checks"].values()), data["checks"]
          assert data["runtime_boundary"] and all(
              value == "TOKEN_VAZIO" for value in data["runtime_boundary"].values()
          ), data["runtime_boundary"]
          print("CURRENT_PROVIDER=PASS_STATIC_ONLY")
          print("ARCHIVED_20260901_RECEIPT=HISTORICAL_NOT_CURRENT")
          print("CLAIM_ALLOWED=false")
          PY
