# ci_track: ops
# ci_abis: armeabi-v7a,arm64-v8a
# This is an orchestration wrapper: independent ABI pipelines, no mixed preflight.
name: RAFCODEPHI APK with real APT — split ABI lanes
on:
  workflow_dispatch:
  workflow_call:
permissions:
  contents: read
  actions: read
concurrency:
  group: real-pkg-split-${{ github.ref }}
  cancel-in-progress: false
jobs:
  arm32-api29-ndk29:
    name: ARM32 API29 · NDK r29 · real APT
    uses: ./.github/workflows/_real-pkg-apk-lane.yml
    with:
      arch: arm
      abi: armeabi-v7a
      max_api: 29
      ndk_version: '29.0.14206865'
  arm64-api30-canonical:
    name: ARM64 API30 · canonical NDK · real APT
    uses: ./.github/workflows/_real-pkg-apk-lane.yml
    with:
      arch: aarch64
      abi: arm64-v8a
      max_api: 30
      ndk_version: '26.3.11579264'
