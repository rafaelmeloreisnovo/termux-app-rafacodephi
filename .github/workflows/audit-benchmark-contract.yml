# ci_track: ops
# ci_abis: n/a
name: audit-benchmark-contract
on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: audit-benchmark-${{ github.event_name }}-${{ github.event_name == 'workflow_dispatch' && github.run_id || (github.event.pull_request.number || github.ref) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  audit-benchmark:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: sudo apt-get update && sudo apt-get install -y ripgrep
      - run: ./scripts/validate_audit_claims.sh
      - run: ./scripts/collect_vectra_grade_benchmarks.sh
      - run: ./scripts/rmr_equivalence_check.sh
      - uses: actions/upload-artifact@v7
        with:
          name: audit-benchmark-reports
          path: reports/*
