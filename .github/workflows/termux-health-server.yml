name: Termux Health Server

on:
  pull_request:
    paths:
      - 'scripts/termux_health_server.py'
      - 'tests/test_termux_health_server.py'
      - 'docs/TERMUX_HEALTH_SERVER_CONTRACT.md'
      - '.github/workflows/termux-health-server.yml'
  push:
    branches: [master]
    paths:
      - 'scripts/termux_health_server.py'
      - 'tests/test_termux_health_server.py'
      - 'docs/TERMUX_HEALTH_SERVER_CONTRACT.md'
      - '.github/workflows/termux-health-server.yml'
  # Existing manual dispatch is retained.
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: termux-health-server-${{ github.ref }}
  cancel-in-progress: true

jobs:
  readonly-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout exact source (read-only)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - name: Gate clean exact producer source
        uses: rafaelmeloreisnovo/actions/rafcode/verify-source@7c03495ebe1d28a11ea419799c4f61427250244f
        with:
          expected-sha: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Python identity
        run: python3 --version

      - name: Syntax
        run: python3 -m py_compile scripts/termux_health_server.py tests/test_termux_health_server.py

      - name: Unit and HTTP integration tests
        run: python3 -m unittest tests/test_termux_health_server.py -v

      - name: Snapshot boundary
        run: |
          RAF_TERMUX_COMMIT="${GITHUB_SHA}" \
            python3 scripts/termux_health_server.py --print-snapshot \
            > termux-health-snapshot.json
          python3 - <<'PY'
          import json
          from pathlib import Path
          payload = json.loads(Path('termux-health-snapshot.json').read_text())
          assert payload['schema'] == 'raf.termux-health.v1'
          assert payload['status'] == 'ok'
          assert payload['runtime'] == 'termux-rafcodephi'
          assert payload['commit']
          assert 'health.readonly' in payload['capabilities']
          forbidden = {'token', 'password', 'secret', 'home', 'prefix', 'path'}
          assert not forbidden.intersection(key.lower() for key in payload)
          print('PASS termux-health-snapshot-boundary')
          PY

      - name: Upload contract artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: termux-health-contract
          path: termux-health-snapshot.json
          if-no-files-found: error
