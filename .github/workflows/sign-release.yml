# ci_track: ops
# ci_abis: arm64-v8a,armeabi-v7a,x86_64,x86
name: Sign & Release APK — Termux RAFCODEΦ

on:
  push:
    tags: ['v*.*.*']
  workflow_dispatch:
    inputs:
      create_release:
        description: Create a DRAFT GitHub release (manual tag only; publish after physical evidence)
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  sign-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6.0.1
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      # Decode keystore — written to a path outside the workspace
      # so it is never accidentally included in build artifacts
      - name: Decode release keystore
        run: printf '%s' "$KEYSTORE_B64" | base64 -d > /tmp/release.jks
        env:
          KEYSTORE_B64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}

      - name: Build signed release APK
        env:
          TERMUX_ENABLE_RELEASE_SIGNING: "true"
          TERMUX_RELEASE_KEYSTORE_FILE: /tmp/release.jks
          TERMUX_RELEASE_KEYSTORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
          TERMUX_RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          TERMUX_RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
          TERMUX_BOOTSTRAP_BAREMETAL_STRICT: "true"
        run: ./gradlew app:assembleRelease

      - name: Upload signed APK (artifact)
        uses: actions/upload-artifact@v7
        with:
          name: termux-rafacodephi-signed-${{ github.ref_name }}
          path: app/build/outputs/apk/release/*.apk
          retention-days: 30
          if-no-files-found: error

  prepare-release-draft:
    name: Prepare release draft only, never publish automatically
    needs: sign-release
    # A tag push may compile a signed candidate but MUST NOT publish anything.
    # A deliberate owner workflow_dispatch targeting an existing v-tag can
    # prepare a private draft. Physical Android gates remain independent.
    if: >-
      ${{
        github.event_name == 'workflow_dispatch' &&
        inputs.create_release == true &&
        startsWith(github.ref, 'refs/tags/v') &&
        github.actor == 'rafaelmeloreisnovo'
      }}
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Download this run's signed candidate only
        uses: actions/download-artifact@v8
        with:
          name: termux-rafacodephi-signed-${{ github.ref_name }}
          path: signed-candidate
      - name: Validate exact requested tag and candidate presence
        shell: bash
        run: |
          set -euo pipefail
          [[ "${GITHUB_EVENT_NAME}" == workflow_dispatch ]]
          [[ "${GITHUB_ACTOR}" == rafaelmeloreisnovo ]]
          [[ "${GITHUB_REF}" =~ ^refs/tags/v[0-9]+\\.[0-9]+\\.[0-9]+([-.][0-9A-Za-z.-]+)?$ ]] || {
            echo '::error::release candidate needs an exact semantic-version tag' >&2
            exit 2
          }
          compgen -G 'signed-candidate/*.apk' > /dev/null || {
            echo '::error::missing same-run signed candidate' >&2
            exit 2
          }
          echo 'release_publication=BLOCKED_DRAFT_ONLY' >> "$GITHUB_STEP_SUMMARY"
          echo 'physical_android=TOKEN_VAZIO_UNLESS_VERIFIED_SEPARATELY' >> "$GITHUB_STEP_SUMMARY"
      - name: Create draft only (manual publication after P0 evidence)
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ github.ref_name }}
          files: signed-candidate/*.apk
          generate_release_notes: true
          draft: true
          prerelease: ${{ contains(github.ref_name, '-beta') || contains(github.ref_name, '-rc') }}
