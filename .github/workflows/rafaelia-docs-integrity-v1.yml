name: RAFAELIA Docs Integrity V1 (scoped, nonpromoting)
on:
  pull_request:
    paths:
      - '**/*.md'
      - 'tools/doc_ref_integrity_gate.py'
      - 'tools/test_doc_ref_integrity_gate.py'
      - '.github/workflows/rafaelia-docs-integrity-v1.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  link-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Checkout exact event SHA
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Python isolated tests (no network)
        run: python3 -m unittest discover -s tools -p 'test_doc_ref_integrity_gate.py' -v
      - name: Current navigation documents (blocking, scoped)
        run: |
          python3 tools/doc_ref_integrity_gate.py \
            --file README.md \
            --file INDICE_DOCUMENTACAO.md \
            --file docs/RAFAELIA_DOCS_RECONCILIATION_20261025.md \
            --file docs/RAFAELIA_ROOT_CENSUS_20261025.md --file tools/rafaelia-q16/README.md
      - name: Historical Markdown audit (nonblocking inventory)
        run: python3 tools/doc_ref_integrity_gate.py --all --audit-only
