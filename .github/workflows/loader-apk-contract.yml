name: Loader APK Contract

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'app/loader/**'
      - 'app/src/main/AndroidManifest.xml'
      - 'app/src/main/java/com/termux/app/BootstrapGateActivity.java'
      - 'app/src/main/java/com/termux/app/BootstrapLoaderClient.java'
      - 'app/src/main/java/com/termux/app/BootstrapHandoffReceiver.java'
      - 'app/src/main/java/com/termux/app/BootstrapIntegrityVerifier.java'
      - 'app/src/main/cpp/termux-bootstrap.c'
      - 'gradle/bootstrap-external.gradle'
      - 'configs/loader-functional-security-contract.json'
      - 'tools/validate_loader_functional_security.py'
      - 'tests/test_loader_functional_security.py'
      - 'docs/security/LOADER_FUNCTIONAL_QUARANTINE.md'
      - 'settings.gradle'
      - 'gradle.properties'
      - 'scripts/find_android_sdk_tool.sh'
      - 'scripts/verify_loader_apk.sh'
      - '.github/workflows/loader-apk-contract.yml'

permissions:
  contents: read

concurrency:
  group: loader-contract-${{ github.ref }}
  cancel-in-progress: true

jobs:
  loader-apk-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Validate loader functional quarantine
        run: |
          python3 -m py_compile tools/validate_loader_functional_security.py
          python3 -m py_compile tests/test_loader_functional_security.py
          python3 -m unittest tests/test_loader_functional_security.py -v
          mkdir -p dist/loader
          python3 tools/validate_loader_functional_security.py \
            --strict --write-report

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Android SDK/NDK
        run: ./scripts/setup_android_toolchain.sh

      - name: Build loader APK
        run: ./gradlew :loader:materializeLoaderApk --no-daemon

      - name: Verify loader APK contract
        run: |
          bash scripts/verify_loader_apk.sh \
            app/loader/build/dist/loader.apk \
            dist/loader/loader-contract.txt

      - name: Upload loader APK
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: termux-rafcodephi-loader-stub-${{ github.sha }}
          path: app/loader/build/dist/loader.apk
          if-no-files-found: warn
          retention-days: 30

      - name: Upload loader contract diagnostics
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: termux-rafcodephi-loader-contract-${{ github.sha }}
          path: |
            dist/loader/loader-functional-security.json
            dist/loader/loader-contract.txt
            dist/loader/loader-badging.txt
            dist/loader/loader-manifest-tree.txt
          if-no-files-found: warn
          retention-days: 30
