# ci_track: artifact
# ci_abis: armeabi-v7a,arm64-v8a
# trigger_generation: 5
name: RAFCODEPHI Usable APK

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/rafcodephi-usable-apk.yml'
  pull_request:
    paths:
      - '.github/workflows/rafcodephi-usable-apk.yml'

permissions:
  contents: read

concurrency:
  group: rafcodephi-usable-apk-${{ github.ref }}
  cancel-in-progress: true

env:
  TERMUX_PACKAGES_BUILD_SHA: 1fc540b0c296581c5793c109e3834589f85a0114
  CLAIM_ALLOWED: 'false'
  PHYSICAL_ANDROID: 'TOKEN_VAZIO'

jobs:
  usable-apk:
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    steps:
      - name: Checkout app
        uses: actions/checkout@v7
        with:
          persist-credentials: false
          fetch-depth: 1

      - name: Setup Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Checkout patched current termux-packages
        uses: actions/checkout@v7
        with:
          repository: rafaelmeloreisnovo/termux-packages
          ref: ${{ env.TERMUX_PACKAGES_BUILD_SHA }}
          path: termux-packages
          persist-credentials: false
          fetch-depth: 1

      - name: Bind RAFCODEPHI package identity
        working-directory: termux-packages
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$TERMUX_PACKAGES_BUILD_SHA"
          mkdir -p build
          python3 scripts/apply-rafcodephi-build-properties.py \
            --properties scripts/properties.sh \
            --receipt build/rafcodephi-build-properties.json
          bash scripts/validate-rafcodephi-build-properties.sh
          grep -F 'libllvm18' packages/libxml2/build.sh

      - name: Source-build real ARM32 and ARM64 bootstrap
        id: bootstrap_build
        working-directory: termux-packages
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build/reports
          chmod +x scripts/run-docker.sh scripts/build-rafcodephi-real-bootstrap.sh
          ./scripts/run-docker.sh \
            ./scripts/build-rafcodephi-real-bootstrap.sh \
            --architectures arm,aarch64 \
            2>&1 | tee build/reports/rafcodephi-usable-bootstrap.log

      - name: Gate bootstrap pair
        id: bootstrap_gate
        working-directory: termux-packages
        shell: bash
        run: |
          set -euo pipefail
          root=artifacts/rafcodephi-bootstrap
          manifest="$root/RAFCODEPHI_REAL_BOOTSTRAP_MANIFEST.txt"
          arm="$root/rafcodephi-bootstrap-arm.zip"
          arm64="$root/rafcodephi-bootstrap-aarch64.zip"
          test -s "$manifest"
          test -s "$arm"
          test -s "$arm64"
          grep -Fx 'schema=rafcodephi.real-bootstrap-sourcebuild/v1' "$manifest"
          grep -Fx 'package_name=com.termux.rafacodephi' "$manifest"
          grep -Fx 'prefix=/data/data/com.termux.rafacodephi/files/usr' "$manifest"
          grep -Fx 'bridge_allowed=false' "$manifest"
          grep -Fx 'legacy_prefix_allowed=false' "$manifest"
          sha256sum "$manifest" "$arm" "$arm64" | tee build/reports/rafcodephi-usable-bootstrap.sha256

      - name: Build signed and unsigned APK matrix
        id: apk_matrix
        env:
          RAF_BOOTSTRAP_SOURCE: source-built-real
          RAF_REAL_BOOTSTRAP_ZIP_ARM: ${{ github.workspace }}/termux-packages/artifacts/rafcodephi-bootstrap/rafcodephi-bootstrap-arm.zip
          RAF_REAL_BOOTSTRAP_ZIP_AARCH64: ${{ github.workspace }}/termux-packages/artifacts/rafcodephi-bootstrap/rafcodephi-bootstrap-aarch64.zip
          RAF_REAL_BOOTSTRAP_MANIFEST: ${{ github.workspace }}/termux-packages/artifacts/rafcodephi-bootstrap/RAFCODEPHI_REAL_BOOTSTRAP_MANIFEST.txt
          RELEASE_TRACK: internal
          APK_MATRIX_UNIT_TESTS_REQUIRED: 'true'
        run: ./scripts/build_apk_matrix.sh

      - name: Gate usable signed APKs
        id: usable_apk_gate
        shell: bash
        run: |
          set -euo pipefail
          test -s dist/apk-matrix/SHA256SUMS.txt
          test -s dist/apk-matrix/ARTIFACT_MANIFEST.txt
          find dist/apk-matrix/signed -type f -name '*armeabi-v7a*-signed.apk' -print -quit | grep -q .
          find dist/apk-matrix/signed -type f -name '*arm64-v8a*-signed.apk' -print -quit | grep -q .
          echo 'RAFCODEPHI_USABLE_APK_GATE=PASS'
          cat dist/apk-matrix/ARTIFACT_MANIFEST.txt
          cat dist/apk-matrix/SHA256SUMS.txt

      - name: Write build receipt
        if: always()
        shell: bash
        env:
          JOB_STATUS: ${{ job.status }}
          BOOTSTRAP_BUILD_OUTCOME: ${{ steps.bootstrap_build.outcome }}
          BOOTSTRAP_GATE_OUTCOME: ${{ steps.bootstrap_gate.outcome }}
          APK_MATRIX_OUTCOME: ${{ steps.apk_matrix.outcome }}
          USABLE_APK_GATE_OUTCOME: ${{ steps.usable_apk_gate.outcome }}
        run: |
          mkdir -p build/reports
          python3 - <<'PY'
          import hashlib, json, os
          from pathlib import Path
          apks=[]
          for p in sorted(Path('dist/apk-matrix').rglob('*.apk')) if Path('dist/apk-matrix').exists() else []:
              apks.append({'path':str(p),'bytes':p.stat().st_size,'sha256':hashlib.sha256(p.read_bytes()).hexdigest()})
          outcomes={
              'bootstrap_build':os.environ.get('BOOTSTRAP_BUILD_OUTCOME','TOKEN_VAZIO'),
              'bootstrap_gate':os.environ.get('BOOTSTRAP_GATE_OUTCOME','TOKEN_VAZIO'),
              'apk_matrix':os.environ.get('APK_MATRIX_OUTCOME','TOKEN_VAZIO'),
              'usable_apk_gate':os.environ.get('USABLE_APK_GATE_OUTCOME','TOKEN_VAZIO'),
          }
          usable_gate_passed=outcomes['usable_apk_gate']=='success'
          doc={
              'schema':'rafcodephi.usable-apk-receipt/v2',
              'receipt_kind':'SUCCESS_ARTIFACT_RECEIPT' if usable_gate_passed else 'FAILURE_DIAGNOSTIC_RECEIPT',
              'job_status':os.environ.get('JOB_STATUS','TOKEN_VAZIO'),
              'step_outcomes':outcomes,
              'usable_apk_gate_passed':usable_gate_passed,
              'app_sha':'${{ github.sha }}',
              'termux_packages_sha':'1fc540b0c296581c5793c109e3834589f85a0114',
              'apk_count':len(apks),
              'apks':apks,
              'physical_android':'TOKEN_VAZIO',
              'claim_allowed_device_runtime':False,
              'invariants':[
                  'receipt_uploaded != usable_apk_gate_passed',
                  'diagnostic_artifact != successful_artifact',
                  'physical_android_TOKEN_VAZIO != runtime_PASS',
              ],
          }
          Path('build/reports/rafcodephi-usable-apk-receipt.json').write_text(json.dumps(doc,indent=2,sort_keys=True)+'\n')
          print(json.dumps(doc,indent=2,sort_keys=True))
          PY

      - name: Upload APKs and receipts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: rafcodephi-usable-apk-${{ github.sha }}
          retention-days: 14
          if-no-files-found: warn
          path: |
            dist/apk-matrix/**
            build/reports/rafcodephi-usable-apk-receipt.json
            termux-packages/build/reports/rafcodephi-usable-bootstrap.log
            termux-packages/build/reports/rafcodephi-usable-bootstrap.sha256
            termux-packages/artifacts/rafcodephi-bootstrap/**
