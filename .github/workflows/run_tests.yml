# ci_track: debug
# ci_abis: n/a
name: Unit tests

# Canonical invocation: 00_START_HERE.yml.
# Manual dispatch remains available for compatibility and focused debugging.
on:
  workflow_call:
  workflow_dispatch:
    inputs:
      reason:
        description: 'Motivo da execução manual (opcional)'
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: unit-tests-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  testing:
    name: "🧪 Testes + smoke + inventário"
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: "📥 1. Checkout"
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: "☕ 2. Java 17"
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6
        with:
          distribution: temurin
          java-version: '17'

      - name: "🤖 3. Android SDK"
        uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd

      - name: "📦 4. Toolchain Android"
        run: ./scripts/ci_android_preflight.sh

      - name: "🧬 5. Contrato side-by-side"
        run: ./gradlew :app:validateSideBySideContract --no-daemon

      - name: "🧾 6. Bootstrap de teste"
        run: |
          set -euo pipefail
          ./scripts/prepare_bootstrap_env.sh --github-env
          echo "TERMUX_BOOTSTRAP_VALIDATION_MODE=upstream-debug-compat" >> "$GITHUB_ENV"

      - name: "🧪 7. Testes unitários"
        run: ./gradlew test --no-daemon

      - name: "🐍 8. Validar Python gerado"
        run: |
          python3 -m py_compile rmr/Rrr/generated/rafaelia_qpu_simulator.py
          python3 -m py_compile rmr/Rrr/generated/rafaelia_auto_calibration.py

      - name: "🧭 9. Smoke RAFAELIA + inventário"
        run: ./scripts/rafaelia_ci_smoke.sh

      - name: "📦 10. Publicar inventário"
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: source-code-inventory-${{ github.sha }}
          if-no-files-found: error
          retention-days: 14
          path: INVENTARIO_CODIGO_FONTE.md
