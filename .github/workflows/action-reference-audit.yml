# ci_track: ops
# ci_abis: n/a
name: GitHub Actions Reference Audit

on:
  pull_request:
    paths:
      - '.github/workflows/**'
      - 'scripts/audit_github_actions_refs.py'
      - 'docs/CI_ACTION_VERSION_POLICY.md'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: action-reference-audit-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  audit-action-references:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Audit action references against dated policy
        run: |
          mkdir -p reports
          python3 scripts/audit_github_actions_refs.py \
            --strict \
            --json reports/github-actions-reference-audit.json

      - name: Upload machine-readable audit
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: github-actions-reference-audit-${{ github.sha }}
          path: reports/github-actions-reference-audit.json
          if-no-files-found: error
