# ci_track: ops
# ci_abis: armeabi-v7a,arm64-v8a
# =============================================================================
# RAFAELIA Orchestrated Pipeline - fail-closed CI/CD
# =============================================================================
# ψ Perception  : cheap/static contracts first; expensive toolchain only after gates
# χ Feedback    : security/compatibility invariants without Android bootstrap overhead
# ρ Expansion   : ARM64 fast lane; full canonical ABI matrix only when requested
# Δ Validation  : unit tests
# Σ Execution   : Android 15/16 compatibility contract (parallel with builds/tests)
# Ω Alignment   : terminal status gate; green only when every requested stage is green
# =============================================================================

name: "🔄 RAFAELIA Pipeline (ψχρΔΣΩ)"

on:
  push:
    branches:
      - master
      - main
      - 'android-15/**'
      - 'arm64/**'
      - 'github-releases/**'
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - 'art/**'
      - 'site/**'
      - '.github/ISSUE_TEMPLATE/**'
      - '.github/FUNDING.yml'
  pull_request:
    branches:
      - master
      - main
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - 'art/**'
      - 'site/**'
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      build_type:
        description: Build Type
        required: true
        default: both
        type: choice
        options: [debug, release, both]
      skip_tests:
        description: Skip Tests
        required: false
        default: false
        type: boolean
      package_variant:
        description: Package Variant
        required: false
        default: both
        type: choice
        options: [both, apt-android-7, apt-android-5]

concurrency:
  group: rafaelia-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name != 'release' }}

env:
  JAVA_VERSION: '17'
  CI: 'true'

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  # ===========================================================================
  # ψ - PERCEPTION: fail early, before Android/NDK/bootstrap costs
  # ===========================================================================
  psi-perception:
    name: "ψ Perception - Contract Gate"
    if: github.event_name != 'release'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      should_continue: ${{ steps.gate.outputs.should_continue }}
      version_name: ${{ steps.version.outputs.version_name }}
      version_tag: ${{ steps.version.outputs.version_tag }}
      build_debug: ${{ steps.build-config.outputs.build_debug }}
      build_release: ${{ steps.build-config.outputs.build_release }}
      build_full_debug: ${{ steps.build-config.outputs.build_full_debug }}
      run_tests: ${{ steps.build-config.outputs.run_tests }}
      variants: ${{ steps.build-config.outputs.variants }}

    steps:
      - name: "📥 Checkout Repository"
        uses: actions/checkout@v6
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: "🔍 Critical File Gate"
        run: |
          set -euo pipefail
          critical_files=(
            app/build.gradle
            gradle.properties
            settings.gradle
            gradlew
            scripts/prepare_bootstrap_env.sh
            scripts/validate_side_by_side_contract.py
            .github/actions/rafaelia-android-setup/action.yml
          )
          for file in "${critical_files[@]}"; do
            [[ -f "$file" ]] || { echo "❌ Missing critical file: $file"; exit 1; }
            echo "✓ $file"
          done

      - name: "🧩 Validate Native Module Structure"
        run: python3 scripts/validate_native_structure.py

      - name: "✅ Validate Gradle Wrapper"
        uses: gradle/actions/wrapper-validation@v6

      - name: "🕒 Validate MVP Metadata Timestamp"
        run: ./scripts/mvp_metadata_timestamp.sh validate

      - name: "🧬 Validate Side-by-Side Contract (static)"
        run: python3 scripts/validate_side_by_side_contract.py

      - name: "🧩 Validate Release Pipeline Contract (static)"
        run: ./scripts/validate_release_pipeline_contract.sh

      - name: "🧰 Setup Canonical Android Build Environment"
        uses: ./.github/actions/rafaelia-android-setup
        with:
          java-version: ${{ env.JAVA_VERSION }}
          prepare-bootstrap: 'true'

      - name: "📋 Extract Version Information"
        id: version
        run: |
          set -euo pipefail
          VERSION_NAME="$(./gradlew -q :app:printVersionName --no-daemon | tail -n 1)"
          if [[ "$GITHUB_EVENT_NAME" == "pull_request" ]]; then
            COMMIT_SHA="${{ github.event.pull_request.head.sha }}"
          else
            COMMIT_SHA="$GITHUB_SHA"
          fi
          VERSION_TAG="v${VERSION_NAME}+${COMMIT_SHA:0:7}"
          echo "version_name=$VERSION_NAME" >> "$GITHUB_OUTPUT"
          echo "version_tag=$VERSION_TAG" >> "$GITHUB_OUTPUT"
          echo "Version: $VERSION_TAG"

      - name: "⚙️ Determine Requested Build Surface"
        id: build-config
        run: |
          set -euo pipefail

          if [[ "$GITHUB_EVENT_NAME" == "pull_request" ]]; then
            BUILD_INPUT=debug
            BUILD_FULL_DEBUG=false
          else
            BUILD_INPUT="${{ inputs.build_type }}"
            [[ -n "$BUILD_INPUT" ]] || BUILD_INPUT=both
            BUILD_FULL_DEBUG=true
          fi

          case "$BUILD_INPUT" in
            debug)
              BUILD_DEBUG=true
              BUILD_RELEASE=false
              ;;
            release)
              BUILD_DEBUG=false
              BUILD_RELEASE=true
              BUILD_FULL_DEBUG=false
              ;;
            both)
              BUILD_DEBUG=true
              BUILD_RELEASE=true
              ;;
            *)
              echo "❌ Unsupported build_type=$BUILD_INPUT"
              exit 2
              ;;
          esac

          if [[ "$GITHUB_EVENT_NAME" == "workflow_dispatch" && "${{ inputs.skip_tests }}" == "true" ]]; then
            RUN_TESTS=false
          else
            RUN_TESTS=true
          fi

          VARIANT_INPUT="${{ inputs.package_variant }}"
          if [[ -z "$VARIANT_INPUT" || "$VARIANT_INPUT" == "both" ]]; then
            VARIANTS='["apt-android-7","apt-android-5"]'
          else
            VARIANTS="[\"$VARIANT_INPUT\"]"
          fi

          echo "build_debug=$BUILD_DEBUG" >> "$GITHUB_OUTPUT"
          echo "build_release=$BUILD_RELEASE" >> "$GITHUB_OUTPUT"
          echo "build_full_debug=$BUILD_FULL_DEBUG" >> "$GITHUB_OUTPUT"
          echo "run_tests=$RUN_TESTS" >> "$GITHUB_OUTPUT"
          echo "variants=$VARIANTS" >> "$GITHUB_OUTPUT"

          printf 'build_debug=%s\nbuild_release=%s\nbuild_full_debug=%s\nrun_tests=%s\nvariants=%s\n' \
            "$BUILD_DEBUG" "$BUILD_RELEASE" "$BUILD_FULL_DEBUG" "$RUN_TESTS" "$VARIANTS"

      - name: "✅ Open Downstream Gate"
        id: gate
        run: echo "should_continue=true" >> "$GITHUB_OUTPUT"

  # ===========================================================================
  # χ - FEEDBACK: cheap invariant checks; no Java/SDK/NDK/bootstrap
  # ===========================================================================
  chi-feedback:
    name: "χ Feedback - Invariant Check"
    needs: psi-perception
    if: needs.psi-perception.result == 'success' && needs.psi-perception.outputs.should_continue == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: "📥 Checkout Repository"
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: "🔐 Enforce 16KB Page Alignment Contract"
        run: |
          set -euo pipefail
          grep -q 'max-page-size=16384' app/build.gradle || {
            echo '❌ app/build.gradle does not enforce 16KB max page size'
            exit 1
          }
          grep -q 'max-page-size=16384' app/src/main/cpp/Android.mk || {
            echo '❌ Android.mk does not enforce 16KB max page size'
            exit 1
          }
          grep -Eq '^termux\.abi\.matrix=armeabi-v7a,arm64-v8a$' gradle.properties || {
            echo '❌ Canonical ABI matrix drifted from armeabi-v7a,arm64-v8a'
            exit 1
          }
          echo '✅ χ invariants passed'

  # ===========================================================================
  # ρ - ARM64 DEBUG FAST LANE
  # ===========================================================================
  rho-expansion-arm64-debug:
    name: "ρ ARM64 Debug (${{ matrix.variant }})"
    needs: [psi-perception, chi-feedback]
    if: |
      needs.psi-perception.result == 'success' &&
      needs.chi-feedback.result == 'success' &&
      needs.psi-perception.outputs.build_debug == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        variant: ${{ fromJson(needs.psi-perception.outputs.variants) }}
    env:
      TERMUX_PACKAGE_VARIANT: ${{ matrix.variant }}
      TERMUX_BOOTSTRAP_VALIDATION_MODE: upstream-debug-compat
      VERSION_TAG: ${{ needs.psi-perception.outputs.version_tag }}

    steps:
      - name: "📥 Checkout Repository"
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: "🧰 Setup Android Build Environment"
        uses: ./.github/actions/rafaelia-android-setup
        with:
          java-version: ${{ env.JAVA_VERSION }}

      - name: "🔨 Build ARM64 Debug APK"
        run: |
          set -euo pipefail
          APK_DIR_PATH="$GITHUB_WORKSPACE/app/build/outputs/apk/debug"
          APK_VERSION_TAG="${VERSION_TAG}-${TERMUX_PACKAGE_VARIANT}-arm64-debug"
          echo "APK_DIR_PATH=$APK_DIR_PATH" >> "$GITHUB_ENV"
          echo "APK_VERSION_TAG=$APK_VERSION_TAG" >> "$GITHUB_ENV"
          export TERMUX_APP_VERSION_NAME="${VERSION_TAG#v}"
          export TERMUX_APK_VERSION_TAG="$APK_VERSION_TAG"
          ./gradlew assembleDebug -Pandroid.injected.build.abi=arm64-v8a --no-daemon --warning-mode all
          find "$APK_DIR_PATH" -maxdepth 1 -type f -name '*.apk' -print

      - name: "📦 Upload ARM64 Debug APK"
        uses: actions/upload-artifact@v7
        with:
          name: termux-arm64-debug-${{ matrix.variant }}-${{ env.APK_VERSION_TAG }}
          path: |
            ${{ env.APK_DIR_PATH }}/*.apk
            ${{ env.APK_DIR_PATH }}/output-metadata.json
          if-no-files-found: error
          retention-days: 30

  # ===========================================================================
  # ρ - ARM64 RELEASE; release-only dispatch does not depend on a fake debug pass
  # ===========================================================================
  rho-expansion-arm64-release:
    name: "ρ ARM64 Release (${{ matrix.variant }})"
    needs: [psi-perception, chi-feedback, rho-expansion-arm64-debug]
    if: |
      always() &&
      needs.psi-perception.result == 'success' &&
      needs.chi-feedback.result == 'success' &&
      needs.psi-perception.outputs.build_release == 'true' &&
      (
        needs.psi-perception.outputs.build_debug != 'true' ||
        needs.rho-expansion-arm64-debug.result == 'success'
      )
    runs-on: ubuntu-latest
    timeout-minutes: 75
    strategy:
      fail-fast: false
      matrix:
        variant: ${{ fromJson(needs.psi-perception.outputs.variants) }}
    env:
      TERMUX_PACKAGE_VARIANT: ${{ matrix.variant }}
      TERMUX_BOOTSTRAP_VALIDATION_MODE: strict
      VERSION_TAG: ${{ needs.psi-perception.outputs.version_tag }}

    steps:
      - name: "📥 Checkout Repository"
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: "🧰 Setup Android Build Environment"
        uses: ./.github/actions/rafaelia-android-setup
        with:
          java-version: ${{ env.JAVA_VERSION }}

      - name: "🔐 Configure Optional Release Signing"
        env:
          INPUT_BUILD_TYPE: release
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: ./scripts/setup_android_signing.sh

      - name: "🔨 Build ARM64 Release APK"
        run: |
          set -euo pipefail
          APK_DIR_PATH="$GITHUB_WORKSPACE/app/build/outputs/apk/release"
          APK_VERSION_TAG="${VERSION_TAG}-${TERMUX_PACKAGE_VARIANT}-arm64-release"
          echo "APK_DIR_PATH=$APK_DIR_PATH" >> "$GITHUB_ENV"
          echo "APK_VERSION_TAG=$APK_VERSION_TAG" >> "$GITHUB_ENV"
          export TERMUX_APP_VERSION_NAME="${VERSION_TAG#v}"
          export TERMUX_APK_VERSION_TAG="$APK_VERSION_TAG"
          ./gradlew assembleRelease -Pandroid.injected.build.abi=arm64-v8a --no-daemon --warning-mode all
          find "$APK_DIR_PATH" -maxdepth 1 -type f -name '*.apk' -print

      - name: "📦 Upload ARM64 Release APK"
        uses: actions/upload-artifact@v7
        with:
          name: termux-arm64-release-${{ matrix.variant }}-${{ env.APK_VERSION_TAG }}
          path: |
            ${{ env.APK_DIR_PATH }}/*.apk
            ${{ env.APK_DIR_PATH }}/output-metadata.json
          if-no-files-found: error
          retention-days: 30

  # ===========================================================================
  # ρ - FULL DEBUG MATRIX; master/push/manual only, canonical ARM ABIs
  # ===========================================================================
  rho-expansion-full-debug:
    name: "ρ Full Debug (${{ matrix.variant }})"
    needs: [psi-perception, chi-feedback, rho-expansion-arm64-debug]
    if: |
      needs.psi-perception.result == 'success' &&
      needs.chi-feedback.result == 'success' &&
      needs.rho-expansion-arm64-debug.result == 'success' &&
      needs.psi-perception.outputs.build_full_debug == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 75
    strategy:
      fail-fast: false
      matrix:
        variant: ${{ fromJson(needs.psi-perception.outputs.variants) }}
    env:
      TERMUX_PACKAGE_VARIANT: ${{ matrix.variant }}
      TERMUX_BOOTSTRAP_VALIDATION_MODE: upstream-debug-compat
      VERSION_TAG: ${{ needs.psi-perception.outputs.version_tag }}

    steps:
      - name: "📥 Checkout Repository"
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: "🧰 Setup Android Build Environment"
        uses: ./.github/actions/rafaelia-android-setup
        with:
          java-version: ${{ env.JAVA_VERSION }}

      - name: "🔨 Build Canonical Debug APK Matrix"
        run: |
          set -euo pipefail
          APK_DIR_PATH="$GITHUB_WORKSPACE/app/build/outputs/apk/debug"
          APK_VERSION_TAG="${VERSION_TAG}-${TERMUX_PACKAGE_VARIANT}-github-debug"
          APK_BASENAME_PREFIX="termux-app_${APK_VERSION_TAG}"
          echo "APK_DIR_PATH=$APK_DIR_PATH" >> "$GITHUB_ENV"
          echo "APK_VERSION_TAG=$APK_VERSION_TAG" >> "$GITHUB_ENV"
          echo "APK_BASENAME_PREFIX=$APK_BASENAME_PREFIX" >> "$GITHUB_ENV"
          export TERMUX_APP_VERSION_NAME="${VERSION_TAG#v}"
          export TERMUX_APK_VERSION_TAG="$APK_VERSION_TAG"

          ./gradlew assembleDebug --no-daemon --warning-mode all

          for abi in arm64-v8a armeabi-v7a; do
            apk="$APK_DIR_PATH/${APK_BASENAME_PREFIX}_${abi}.apk"
            [[ -s "$apk" ]] || { echo "❌ Missing canonical ABI artifact: $apk"; ls -la "$APK_DIR_PATH"; exit 1; }
            echo "✓ $apk"
          done

          cd "$APK_DIR_PATH"
          sha256sum *.apk > sha256sums.txt
          [[ -s sha256sums.txt ]]

      - name: "📦 Upload Canonical Debug Matrix"
        uses: actions/upload-artifact@v7
        with:
          name: ${{ env.APK_BASENAME_PREFIX }}_canonical-matrix
          path: |
            ${{ env.APK_DIR_PATH }}/${{ env.APK_BASENAME_PREFIX }}_arm64-v8a.apk
            ${{ env.APK_DIR_PATH }}/${{ env.APK_BASENAME_PREFIX }}_armeabi-v7a.apk
            ${{ env.APK_DIR_PATH }}/${{ env.APK_BASENAME_PREFIX }}_universal.apk
            ${{ env.APK_DIR_PATH }}/output-metadata.json
            ${{ env.APK_DIR_PATH }}/sha256sums.txt
          if-no-files-found: error
          retention-days: 30

  # ===========================================================================
  # Δ - UNIT TESTS
  # ===========================================================================
  delta-validation:
    name: "Δ Validation - Unit Tests"
    needs: [psi-perception, chi-feedback]
    if: |
      needs.psi-perception.result == 'success' &&
      needs.chi-feedback.result == 'success' &&
      needs.psi-perception.outputs.run_tests == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: "📥 Checkout Repository"
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: "🧰 Setup Android Build Environment"
        uses: ./.github/actions/rafaelia-android-setup
        with:
          java-version: ${{ env.JAVA_VERSION }}

      - name: "🧪 Run Unit Tests"
        run: ./gradlew test --no-daemon --warning-mode all

      - name: "📊 Upload Test Results"
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-results-${{ github.run_id }}
          path: |
            app/build/reports/tests/
            terminal-emulator/build/reports/tests/
            terminal-view/build/reports/tests/
            termux-shared/build/reports/tests/
          if-no-files-found: warn
          retention-days: 7

  # ===========================================================================
  # Σ - COMPATIBILITY: independent after ψχ, so it runs in parallel with ρ/Δ
  # ===========================================================================
  sigma-execution:
    name: "Σ Execution - Android Compatibility"
    needs: [psi-perception, chi-feedback]
    if: |
      needs.psi-perception.result == 'success' &&
      needs.chi-feedback.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: "📥 Checkout Repository"
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: "🧰 Setup Android Build Environment"
        uses: ./.github/actions/rafaelia-android-setup
        with:
          java-version: ${{ env.JAVA_VERSION }}

      - name: "🔍 Validate Android 15/16 Compatibility"
        run: ./gradlew validateAndroid15Compatibility --no-daemon --warning-mode all

  # ===========================================================================
  # Ω - TERMINAL FAIL-CLOSED GATE
  # ===========================================================================
  omega-alignment:
    name: "Ω Alignment - Terminal Gate"
    needs:
      - psi-perception
      - chi-feedback
      - rho-expansion-arm64-debug
      - rho-expansion-arm64-release
      - rho-expansion-full-debug
      - delta-validation
      - sigma-execution
    if: always() && github.event_name != 'release'
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: "📊 Evaluate Requested Pipeline Surface"
        run: |
          set -euo pipefail
          failures=()

          require_success() {
            local label="$1"
            local result="$2"
            if [[ "$result" != "success" ]]; then
              failures+=("$label=$result")
            fi
          }

          PSI="${{ needs.psi-perception.result }}"
          CHI="${{ needs.chi-feedback.result }}"
          ARM64_DEBUG="${{ needs.rho-expansion-arm64-debug.result }}"
          ARM64_RELEASE="${{ needs.rho-expansion-arm64-release.result }}"
          FULL_DEBUG="${{ needs.rho-expansion-full-debug.result }}"
          DELTA="${{ needs.delta-validation.result }}"
          SIGMA="${{ needs.sigma-execution.result }}"

          require_success ψ "$PSI"
          require_success χ "$CHI"
          require_success Σ "$SIGMA"

          if [[ "${{ needs.psi-perception.outputs.build_debug }}" == "true" ]]; then
            require_success ρ-arm64-debug "$ARM64_DEBUG"
          fi
          if [[ "${{ needs.psi-perception.outputs.build_release }}" == "true" ]]; then
            require_success ρ-arm64-release "$ARM64_RELEASE"
          fi
          if [[ "${{ needs.psi-perception.outputs.build_full_debug }}" == "true" ]]; then
            require_success ρ-full-debug "$FULL_DEBUG"
          fi
          if [[ "${{ needs.psi-perception.outputs.run_tests }}" == "true" ]]; then
            require_success Δ "$DELTA"
          fi

          {
            echo '## Ω RAFAELIA Pipeline Receipt'
            echo
            echo '| Stage | Result |'
            echo '|---|---|'
            echo "| ψ Perception | $PSI |"
            echo "| χ Feedback | $CHI |"
            echo "| ρ ARM64 Debug | $ARM64_DEBUG |"
            echo "| ρ ARM64 Release | $ARM64_RELEASE |"
            echo "| ρ Full Debug | $FULL_DEBUG |"
            echo "| Δ Tests | $DELTA |"
            echo "| Σ Compatibility | $SIGMA |"
            echo
            echo "Commit: \`${{ github.sha }}\`"
            echo "Ref: \`${{ github.ref }}\`"
          } >> "$GITHUB_STEP_SUMMARY"

          if (( ${#failures[@]} > 0 )); then
            printf '❌ Ω FAIL-CLOSED: %s\n' "${failures[*]}"
            printf '\n**Ω verdict:** ❌ FAIL-CLOSED — `%s`\n' "${failures[*]}" >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi

          echo '✅ Ω PASS: every requested stage succeeded.'
          echo >> "$GITHUB_STEP_SUMMARY"
          echo '**Ω verdict:** ✅ PASS — every requested stage succeeded.' >> "$GITHUB_STEP_SUMMARY"

  # ===========================================================================
  # RELEASE POST-PUBLISH ORCHESTRATION
  # ===========================================================================
  release-attach-debug-apks:
    name: "Release - Attach Debug APKs"
    if: github.event_name == 'release'
    uses: ./.github/workflows/attach_debug_apks_to_release.yml
    permissions:
      contents: write
    secrets: inherit
    with:
      release_ref: ${{ github.ref }}

  release-trigger-jitpack:
    name: "Release - Trigger JitPack Builds"
    if: github.event_name == 'release'
    needs: [release-attach-debug-apks]
    uses: ./.github/workflows/trigger_library_builds_on_jitpack.yml
    permissions:
      contents: read
    secrets: inherit
    with:
      release_ref: ${{ github.ref }}
