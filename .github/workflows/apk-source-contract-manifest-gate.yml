# ci_track: ops
# ci_abis: armeabi-v7a,arm64-v8a
name: RAFCODEPHI APK source-contract manifest gate

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'scripts/build_apk_matrix.sh'
      - 'scripts/append_apk_source_contract.sh'
      - 'tests/test_apk_matrix_source_contract.py'
      - '.github/workflows/apk-source-contract-manifest-gate.yml'

permissions:
  contents: read

jobs:
  contract-handoff:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Bash syntax
        run: bash -n scripts/build_apk_matrix.sh scripts/append_apk_source_contract.sh

      - name: Adversarial source-contract handoff
        run: python3 tests/test_apk_matrix_source_contract.py

      - name: Scope receipt
        run: |
          echo 'PASS_SCOPED: source-contract path/identity/anti-replay tests only' >> "$GITHUB_STEP_SUMMARY"
          echo 'APK build, Android hardware, APT publishing, signing and runtime: NOT_RUN' >> "$GITHUB_STEP_SUMMARY"
