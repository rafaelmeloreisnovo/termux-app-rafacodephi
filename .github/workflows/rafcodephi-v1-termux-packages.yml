name: RAFCODEPHI V1 — termux-packages to APK

on:
  repository_dispatch:
    types: [rafcodephi_packages_ready]
  workflow_dispatch:
    inputs:
      termux_packages_ref:
        description: canonical | candidate | exact 40-char termux-packages commit
        required: true
        default: canonical
        type: string
  pull_request:
    branches: [master]
    paths:
      - '.github/workflows/rafcodephi-v1-termux-packages.yml'
      - 'data/contracts/termux-packages-rafcodephi-pin.v1.json'
      - 'scripts/resolve_termux_packages_pin.py'
      - 'docs/RAFCODEPHI_V1_TERMUX_PACKAGES.md'
      - 'tests/test_rafcodephi_v1_termux_packages_contract.py'
      - 'app/src/main/java/com/termux/app/BetaRealBootstrapRepair.java'
      - 'app/src/main/java/com/termux/app/BootstrapBaremetalGuard.java'
      - 'app/src/main/java/com/termux/app/BootstrapReadinessGate.java'
      - 'app/src/main/java/com/termux/app/BootstrapWizardSource.java'
      - 'app/src/main/java/com/termux/app/TermuxInstaller.java'
      - 'app/src/main/java/com/termux/app/activities/BetaBootstrapWizardActivity.java'
      - 'app/src/main/java/com/termux/app/activities/SettingsActivity.java'
      - 'app/src/main/res/xml/root_preferences.xml'
      - 'tests/test_rafcodephi_startup_and_settings_contract.py'

permissions:
  contents: read

concurrency:
  group: rafcodephi-v1-termux-packages-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  CLAIM_ALLOWED: 'false'
  PHYSICAL_ANDROID: 'TOKEN_VAZIO'

jobs:
  contract:
    name: V1 contract — fail closed
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout app
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Validate V1 integration contract
        run: python3 tests/test_rafcodephi_v1_termux_packages_contract.py

  integrated-v1:
    name: termux-packages → real bootstrap → debug APK
    needs: contract
    runs-on: ubuntu-24.04
    timeout-minutes: 210
    env:
      SELECTED_TERMUX_PACKAGES_SELECTOR: ${{ github.event_name == 'repository_dispatch' && github.event.client_payload.termux_packages_sha || (github.event_name == 'workflow_dispatch' && inputs.termux_packages_ref || 'canonical') }}
      PRODUCER_RUN_ID: ${{ github.event.client_payload.producer_run_id || '' }}
      PRODUCER_ARTIFACT_NAME: ${{ github.event.client_payload.artifact_name || '' }}
      PRODUCER_RECEIPT_SHA256: ${{ github.event.client_payload.receipt_sha256 || '' }}
      PRODUCER_ARTIFACT_ID: ${{ github.event.client_payload.artifact_id || '' }}
      PRODUCER_ARTIFACT_DIGEST: ${{ github.event.client_payload.artifact_digest || '' }}
    steps:
      - name: Checkout exact app revision
        uses: actions/checkout@v7
        with:
          persist-credentials: false
          fetch-depth: 1

      - name: Validate automatic producer handoff
        if: github.event_name == 'repository_dispatch'
        shell: bash
        env:
          CROSS_REPO_TOKEN: ${{ secrets.GITPAT || secrets.PATGITHUB || secrets.GIT }}
        run: |
          set -euo pipefail
          SHA="${{ github.event.client_payload.termux_packages_sha }}"
          RUN_ID="${{ github.event.client_payload.producer_run_id }}"
          ARTIFACT="${{ github.event.client_payload.artifact_name }}"
          RECEIPT_SHA="${{ github.event.client_payload.receipt_sha256 }}"
          ARTIFACT_ID="${{ github.event.client_payload.artifact_id }}"
          ARTIFACT_DIGEST="${{ github.event.client_payload.artifact_digest }}"

          [[ "$SHA" =~ ^[0-9a-f]{40}$ ]] || { echo "BLOCKED invalid producer SHA: $SHA" >&2; exit 2; }
          [[ "$RUN_ID" =~ ^[0-9]+$ ]] || { echo "BLOCKED invalid producer run id: $RUN_ID" >&2; exit 2; }
          [[ "$ARTIFACT" == "rafcodephi-termux-packages-$SHA" ]] || { echo "BLOCKED artifact identity mismatch: $ARTIFACT" >&2; exit 2; }
          [[ "$RECEIPT_SHA" =~ ^[0-9a-f]{64}$ ]] || { echo "BLOCKED invalid receipt sha256" >&2; exit 2; }
          [[ "$ARTIFACT_ID" =~ ^[0-9]+$ ]] || { echo "BLOCKED invalid artifact id" >&2; exit 2; }
          [[ "$ARTIFACT_DIGEST" =~ ^[0-9a-f]{64}$ ]] || { echo "BLOCKED invalid artifact digest" >&2; exit 2; }
          [[ -n "${CROSS_REPO_TOKEN:-}" ]] || { echo "TOKEN_VAZIO: PATGITHUB required for cross-repo artifact read" >&2; exit 2; }

          echo "TERMUX_PACKAGES_SHA=$SHA" >> "$GITHUB_ENV"
          echo "SELECTED_TERMUX_PACKAGES_SELECTOR=producer:$SHA" >> "$GITHUB_ENV"

      - name: Resolve semantic termux-packages pin
        if: github.event_name != 'repository_dispatch'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build/reports
          python3 scripts/resolve_termux_packages_pin.py \
            "$SELECTED_TERMUX_PACKAGES_SELECTOR" \
            --github-env --json \
            | tee build/reports/rafcodephi-v1-packages-pin-resolution.json

      - name: Checkout pinned termux-packages source
        if: github.event_name != 'repository_dispatch'
        uses: actions/checkout@v7
        with:
          repository: rafaelmeloreisnovo/termux-packages
          ref: ${{ env.TERMUX_PACKAGES_SHA }}
          path: termux-packages
          persist-credentials: false
          fetch-depth: 1

      - name: Bind termux-packages identity and provenance
        if: github.event_name != 'repository_dispatch'
        working-directory: termux-packages
        shell: bash
        run: |
          set -euo pipefail
          ACTUAL_SHA="$(git rev-parse HEAD)"
          test -n "$ACTUAL_SHA"
          test "$ACTUAL_SHA" = "$TERMUX_PACKAGES_SHA"
          mkdir -p build/reports
          python3 scripts/apply-rafcodephi-build-properties.py \
            --properties scripts/properties.sh \
            --receipt build/reports/rafcodephi-v1-properties.json
          bash scripts/validate-rafcodephi-build-properties.sh
          printf '%s\n' "$ACTUAL_SHA" > build/reports/rafcodephi-v1-termux-packages.commit
          sha256sum scripts/properties.sh > build/reports/rafcodephi-v1-properties.sha256

      - name: Build real ARM and ARM64 bootstrap from termux-packages
        if: github.event_name != 'repository_dispatch'
        working-directory: termux-packages
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build/reports
          chmod +x scripts/run-docker.sh scripts/build-rafcodephi-real-bootstrap.sh
          set +e
          ./scripts/run-docker.sh \
            ./scripts/build-rafcodephi-real-bootstrap.sh \
            --architectures arm,aarch64 \
            2>&1 | tee build/reports/rafcodephi-v1-real-bootstrap.log
          build_status="${PIPESTATUS[0]}"
          set -e
          python3 - "$build_status" > build/reports/rafcodephi-v1-real-bootstrap-status.json <<'PY'
          import json
          import sys

          status = int(sys.argv[1])
          print(json.dumps({
              "schema": "rafcodephi.v1-real-bootstrap-source-build/v1",
              "state": "PASS" if status == 0 else "BLOCKED",
              "exit_code": status,
              "claim_allowed_release": False,
              "device_runtime_proof": "TOKEN_VAZIO",
          }, sort_keys=True))
          PY
          if [[ "$build_status" -ne 0 ]]; then
            echo "RAFCODEPHI_V1_REAL_BOOTSTRAP=BLOCKED exit_code=$build_status" >&2
            exit "$build_status"
          fi

      - name: Download exact producer artifact
        if: github.event_name == 'repository_dispatch'
        uses: actions/download-artifact@v8
        with:
          artifact-ids: ${{ github.event.client_payload.artifact_id }}
          path: termux-packages
          repository: rafaelmeloreisnovo/termux-packages
          run-id: ${{ github.event.client_payload.producer_run_id }}
          github-token: ${{ secrets.GITPAT || secrets.PATGITHUB || secrets.GIT }}

      - name: Verify producer receipt binding
        if: github.event_name == 'repository_dispatch'
        shell: bash
        run: |
          set -euo pipefail
          RECEIPT=termux-packages/build/reports/rafcodephi-auto-handoff.json
          test -s "$RECEIPT"
          ACTUAL_RECEIPT_SHA="$(sha256sum "$RECEIPT" | awk '{print $1}')"
          test "$ACTUAL_RECEIPT_SHA" = "$PRODUCER_RECEIPT_SHA256"

          python3 - "$RECEIPT" "$TERMUX_PACKAGES_SHA" "$PRODUCER_RUN_ID" "$PRODUCER_ARTIFACT_NAME" <<'PY'
          import hashlib, json, sys
          from pathlib import Path
          receipt_path = Path(sys.argv[1])
          receipt = json.loads(receipt_path.read_text(encoding="utf-8"))
          expected_sha, expected_run, expected_artifact = sys.argv[2:5]
          assert receipt["schema"] == "rafcodephi.termux-packages-producer-handoff/v1"
          assert receipt["state"] == "BUILD_EVIDENCE_PASS"
          assert receipt["producer_repository"] == "rafaelmeloreisnovo/termux-packages"
          assert receipt["producer_commit"] == expected_sha
          assert str(receipt["producer_run_id"]) == expected_run
          assert receipt["artifact_name"] == expected_artifact
          assert receipt["package_name"] == "com.termux.rafacodephi"
          assert receipt["prefix"] == "/data/data/com.termux.rafacodephi/files/usr"
          assert receipt["claim_allowed"] is False
          assert receipt["physical_android"] == "TOKEN_VAZIO"

          expected_paths = {
              "artifacts/rafcodephi-bootstrap/RAFCODEPHI_REAL_BOOTSTRAP_MANIFEST.txt":
                  Path("termux-packages/artifacts/rafcodephi-bootstrap/RAFCODEPHI_REAL_BOOTSTRAP_MANIFEST.txt"),
              "artifacts/rafcodephi-bootstrap/rafcodephi-bootstrap-arm.zip":
                  Path("termux-packages/artifacts/rafcodephi-bootstrap/rafcodephi-bootstrap-arm.zip"),
              "artifacts/rafcodephi-bootstrap/rafcodephi-bootstrap-aarch64.zip":
                  Path("termux-packages/artifacts/rafcodephi-bootstrap/rafcodephi-bootstrap-aarch64.zip"),
          }
          recorded = receipt.get("sha256")
          assert isinstance(recorded, dict)
          assert set(recorded) == set(expected_paths)
          for key, path in expected_paths.items():
              h = hashlib.sha256()
              with path.open("rb") as fh:
                  for block in iter(lambda: fh.read(1 << 20), b""):
                      h.update(block)
              actual = h.hexdigest()
              assert actual == recorded[key], f"producer byte digest mismatch for {key}"
          PY

      - name: Gate package/bootstrap output
        working-directory: termux-packages
        shell: bash
        run: |
          set -euo pipefail
          MANIFEST=artifacts/rafcodephi-bootstrap/RAFCODEPHI_REAL_BOOTSTRAP_MANIFEST.txt
          ARM=artifacts/rafcodephi-bootstrap/rafcodephi-bootstrap-arm.zip
          ARM64=artifacts/rafcodephi-bootstrap/rafcodephi-bootstrap-aarch64.zip
          test -s "$MANIFEST"
          test -s "$ARM"
          test -s "$ARM64"
          grep -Fx 'schema=rafcodephi.real-bootstrap-sourcebuild/v1' "$MANIFEST"
          grep -Fx 'package_name=com.termux.rafacodephi' "$MANIFEST"
          grep -Fx 'prefix=/data/data/com.termux.rafacodephi/files/usr' "$MANIFEST"
          grep -Fx 'bridge_allowed=false' "$MANIFEST"
          grep -Fx 'legacy_prefix_allowed=false' "$MANIFEST"
          grep -Fx 'claim_allowed_device_runtime=false' "$MANIFEST"
          grep -Fx 'device_runtime_proof=TOKEN_VAZIO' "$MANIFEST"
          sha256sum "$MANIFEST" "$ARM" "$ARM64" > build/reports/rafcodephi-v1-bootstrap.sha256

      - name: Setup Android build environment
        uses: ./.github/actions/rafaelia-android-setup
        with:
          java-version: '17'
          prepare-bootstrap: 'false'

      - name: Install focused test dependency
        run: python3 -m pip install --disable-pip-version-check pytest

      - name: Import exact source-built bootstrap pair and build V1 APK
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build/reports
          export RAF_BOOTSTRAP_SOURCE=source-built-real
          export RAF_REAL_BOOTSTRAP_ZIP_ARM="$GITHUB_WORKSPACE/termux-packages/artifacts/rafcodephi-bootstrap/rafcodephi-bootstrap-arm.zip"
          export RAF_REAL_BOOTSTRAP_ZIP_AARCH64="$GITHUB_WORKSPACE/termux-packages/artifacts/rafcodephi-bootstrap/rafcodephi-bootstrap-aarch64.zip"
          export RAF_REAL_BOOTSTRAP_MANIFEST="$GITHUB_WORKSPACE/termux-packages/artifacts/rafcodephi-bootstrap/RAFCODEPHI_REAL_BOOTSTRAP_MANIFEST.txt"
          bash scripts/prepare_bootstrap_env.sh --print-env --skip-android-preflight \
            > build/reports/rafcodephi-v1-bootstrap.env
          set -a
          # shellcheck disable=SC1091
          source build/reports/rafcodephi-v1-bootstrap.env
          set +a

          python3 -m pytest -q tests/test_source_built_real_bootstrap.py

          export TERMUX_APP_VERSION_NAME="0.118.0-rafcodephi-v1"
          export TERMUX_APK_VERSION_TAG="rafcodephi-v1-${GITHUB_SHA::12}"
          ./gradlew assembleDebug --no-daemon --warning-mode all

          APK_DIR_PATH="$(bash scripts/resolve_apk_output_dir.sh \
            "$TERMUX_APK_VERSION_TAG" arm64-v8a armeabi-v7a)"
          printf '%s\n' "$APK_DIR_PATH" > build/reports/rafcodephi-v1-apk-dir.txt
          sha256sum "$APK_DIR_PATH"/*.apk > build/reports/rafcodephi-v1-apk.sha256

      - name: Emit cross-repository V1 receipt
        shell: bash
        run: |
          set -euo pipefail
          APP_SHA="$(git rev-parse HEAD)"
          if [[ "$GITHUB_EVENT_NAME" == "repository_dispatch" ]]; then
            PKG_SHA="$TERMUX_PACKAGES_SHA"
          else
            PKG_SHA="$(git -C termux-packages rev-parse HEAD)"
          fi
          MANIFEST=termux-packages/artifacts/rafcodephi-bootstrap/RAFCODEPHI_REAL_BOOTSTRAP_MANIFEST.txt
          ARM=termux-packages/artifacts/rafcodephi-bootstrap/rafcodephi-bootstrap-arm.zip
          ARM64=termux-packages/artifacts/rafcodephi-bootstrap/rafcodephi-bootstrap-aarch64.zip
          APP_IMPORT=build/reports/rafcodephi-real-bootstrap-import-matrix.json
          APK_SHA=build/reports/rafcodephi-v1-apk.sha256
          test -s "$APP_IMPORT"
          test -s "$APK_SHA"
          python3 - "$APP_SHA" "$PKG_SHA" "$MANIFEST" "$ARM" "$ARM64" "$APP_IMPORT" "$APK_SHA" <<'PY'
          import hashlib, json, sys
          from pathlib import Path

          app_sha, pkg_sha = sys.argv[1], sys.argv[2]
          paths = [Path(p) for p in sys.argv[3:]]
          def sha256(path):
              h = hashlib.sha256()
              with path.open('rb') as f:
                  for block in iter(lambda: f.read(1 << 20), b''):
                      h.update(block)
              return h.hexdigest()
          apk_manifest = Path(sys.argv[-1])
          apk_sha256 = {}
          for raw in apk_manifest.read_text(encoding='utf-8').splitlines():
              if not raw.strip():
                  continue
              digest, filename = raw.split(None, 1)
              apk_path = Path(filename.strip())
              actual = sha256(apk_path)
              if actual != digest:
                  raise SystemExit(f'APK checksum manifest mismatch for {apk_path}')
              apk_sha256[str(apk_path)] = actual
          if not apk_sha256:
              raise SystemExit('no APK digests recorded')

          receipt = {
              'schema': 'rafcodephi.v1-termux-packages-to-apk/v1',
              'state': 'BUILD_EVIDENCE_PASS',
              'app_commit': app_sha,
              'termux_packages_commit': pkg_sha,
              'termux_packages_selector': __import__('os').environ.get('SELECTED_TERMUX_PACKAGES_SELECTOR', 'canonical'),
              'producer_artifact_id': __import__('os').environ.get('PRODUCER_ARTIFACT_ID', 'TOKEN_VAZIO'),
              'producer_artifact_digest': __import__('os').environ.get('PRODUCER_ARTIFACT_DIGEST', 'TOKEN_VAZIO'),
              'apk_sha256': apk_sha256,
              'package_name': 'com.termux.rafacodephi',
              'prefix': '/data/data/com.termux.rafacodephi/files/usr',
              'source_built_arm_arm64': True,
              'bridge_allowed': False,
              'legacy_prefix_allowed': False,
              'package_repo_runtime_state': 'BLOCKED_CUSTOM_REPOSITORY_NOT_PUBLISHED',
              'physical_android': 'TOKEN_VAZIO',
              'claim_allowed': False,
              'sha256': {str(p): sha256(p) for p in paths},
          }
          out = Path('build/reports/rafcodephi-v1-cross-repo-receipt.json')
          out.write_text(json.dumps(receipt, indent=2, sort_keys=True) + '\n', encoding='utf-8')
          print(out)
          PY
          sha256sum build/reports/rafcodephi-v1-cross-repo-receipt.json \
            > build/reports/rafcodephi-v1-cross-repo-receipt.json.sha256

      - name: Upload V1 APK and evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: rafcodephi-v1-${{ github.run_id }}
          path: |
            build/reports/rafcodephi-v1-*
            build/reports/rafcodephi-real-bootstrap-import-*.json
            app/build/outputs/apk/**/*.apk
            app/build/outputs/apk/**/output-metadata.json
            termux-packages/build/reports/rafcodephi-v1-*
            termux-packages/build/reports/rafcodephi-v1-real-bootstrap.log
            termux-packages/build/reports/rafcodephi-v1-real-bootstrap-status.json
            termux-packages/artifacts/rafcodephi-bootstrap/RAFCODEPHI_REAL_BOOTSTRAP_MANIFEST.txt
          if-no-files-found: error
          retention-days: 30
