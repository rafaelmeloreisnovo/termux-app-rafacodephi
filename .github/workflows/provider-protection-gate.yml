# ci_track: ops
# ci_abis: n/a
name: Provider Protection Gate

on:
  workflow_call:
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: provider-protection-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  provider-protection:
    name: provider-protection
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout immutable source
        uses: actions/checkout@v7
        with:
          persist-credentials: false
          fetch-depth: 1

      - name: Offline evaluator contract tests
        run: python3 tests/test_provider_protection_contract.py

      - name: Evaluate live default-branch ruleset
        id: live
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          python3 scripts/ci/provider_protection_contract.py \
            --target governance/provider/PROVIDER_RULESET_TARGET.v2.json \
            --default-branch master \
            --json reports/provider-protection-receipt.json \
            --markdown reports/provider-protection-receipt.md

      - name: Human summary
        if: always()
        run: |
          set -euo pipefail
          if [[ -f reports/provider-protection-receipt.md ]]; then
            cat reports/provider-protection-receipt.md >> "$GITHUB_STEP_SUMMARY"
          else
            {
              echo '# Provider Protection Receipt V2'
              echo
              echo '- gate: **FAIL**'
              echo '- receipt: **TOKEN_VAZIO — evaluator did not materialize output**'
              echo '- claim_allowed: **false**'
            } >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Publish provider receipt
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: provider-protection-receipt-${{ github.run_id }}-${{ github.run_attempt }}
          if-no-files-found: warn
          retention-days: 30
          path: |
            reports/provider-protection-receipt.json
            reports/provider-protection-receipt.md

      - name: Fail closed after evidence publication
        if: always()
        env:
          LIVE_OUTCOME: ${{ steps.live.outcome }}
        run: |
          set -euo pipefail
          if [[ "$LIVE_OUTCOME" != "success" ]]; then
            echo "Provider protection contract is not satisfied; inspect the published receipt." >&2
            exit 4
          fi
          echo "PROVIDER_PROTECTION=PASS"
