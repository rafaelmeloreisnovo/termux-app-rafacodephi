name: Provider Protection Gate

on:
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  provider-protection:
    name: provider-protection
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Verify live default-branch ruleset
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPOSITORY: ${{ github.repository }}
          DEFAULT_BRANCH: master
        run: |
          python3 - <<'PY'
          import json
          import os
          import sys
          import urllib.request

          repo = os.environ["REPOSITORY"]
          branch = os.environ["DEFAULT_BRANCH"]
          token = os.environ.get("GH_TOKEN", "")
          headers = {
              "Accept": "application/vnd.github+json",
              "User-Agent": "rafaelia-provider-protection-gate",
              "X-GitHub-Api-Version": "2022-11-28",
          }
          if token:
              headers["Authorization"] = f"Bearer {token}"

          def get(url):
              req = urllib.request.Request(url, headers=headers)
              with urllib.request.urlopen(req, timeout=20) as response:
                  return json.load(response)

          base = f"https://api.github.com/repos/{repo}"
          try:
              listed = get(base + "/rulesets")
          except Exception as exc:
              print(f"ERROR: cannot read provider rulesets: {exc}")
              sys.exit(2)

          applicable = []
          for item in listed:
              if item.get("enforcement") != "active":
                  continue
              try:
                  detail = get(base + f"/rulesets/{item['id']}")
              except Exception as exc:
                  print(f"ERROR: cannot read ruleset {item.get('id')}: {exc}")
                  sys.exit(2)
              cond = ((detail.get("conditions") or {}).get("ref_name") or {})
              includes = set(cond.get("include") or [])
              if "~DEFAULT_BRANCH" in includes or f"refs/heads/{branch}" in includes:
                  applicable.append(detail)

          if not applicable:
              print("ERROR: no active ruleset applies to the default branch")
              sys.exit(3)

          rules = []
          bypass = []
          for rs in applicable:
              rules.extend(rs.get("rules") or [])
              bypass.extend(rs.get("bypass_actors") or [])

          by_type = {}
          for rule in rules:
              by_type.setdefault(rule.get("type"), []).append(rule)

          required_types = {
              "deletion",
              "non_fast_forward",
              "required_linear_history",
              "required_signatures",
              "code_quality",
              "pull_request",
              "required_status_checks",
          }
          missing = sorted(t for t in required_types if t not in by_type)
          failures = []
          if missing:
              failures.append("missing rule types: " + ", ".join(missing))

          pr_ok = False
          for rule in by_type.get("pull_request", []):
              p = rule.get("parameters") or {}
              if (
                  p.get("required_review_thread_resolution") is True
                  and int(p.get("required_approving_review_count", 0)) == 0
                  and p.get("require_code_owner_review") is False
              ):
                  pr_ok = True
                  break
          if not pr_ok:
              failures.append("pull_request rule is not solo-safe + thread-resolution enforced")

          status_ok = False
          strict_ok = False
          for rule in by_type.get("required_status_checks", []):
              p = rule.get("parameters") or {}
              contexts = p.get("required_status_checks") or []
              names = {c.get("context") for c in contexts if isinstance(c, dict)}
              if "provider-protection" in names:
                  status_ok = True
                  if p.get("strict_required_status_checks_policy") is True:
                      strict_ok = True
          if not status_ok:
              failures.append("required status context provider-protection is absent")
          if status_ok and not strict_ok:
              failures.append("provider-protection exists but strict required checks policy is not enabled")

          print(json.dumps({
              "schema": "rafaelia.provider_protection_gate/v1",
              "repository": repo,
              "default_branch": branch,
              "applicable_ruleset_ids": [r.get("id") for r in applicable],
              "rule_types": sorted(k for k in by_type if k),
              "always_bypass_integrations": [
                  b.get("actor_id") for b in bypass
                  if b.get("actor_type") == "Integration" and b.get("bypass_mode") == "always"
              ],
              "bypass_identity_state": "TOKEN_VAZIO_PENDING_IDENTITY_AND_JUSTIFICATION" if bypass else "NONE_OBSERVED",
              "failures": failures,
              "claim_allowed": False,
          }, indent=2, sort_keys=True))

          if failures:
              sys.exit(4)
          print("PASS: provider ruleset target is enforced for the default branch")
          PY
