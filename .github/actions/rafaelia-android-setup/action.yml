name: RAFAELIA Android CI Setup
description: Deterministic Java, Android toolchain, Gradle cache and bootstrap preparation for RAFAELIA jobs.

inputs:
  java-version:
    description: Java version used by Android/Gradle builds.
    required: false
    default: '21'
  node-version:
    description: Maintained Node.js LTS used by JavaScript tooling and startup smoke tests.
    required: false
    default: '24'
  prepare-bootstrap:
    description: Prepare and hash embedded bootstrap archives.
    required: false
    default: 'true'

runs:
  using: composite
  steps:
    - name: Setup Java
      uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6
      with:
        distribution: temurin
        java-version: ${{ inputs.java-version }}
        cache: gradle

    - name: Setup Node.js LTS
      uses: actions/setup-node@2028fbc5c25fe9cf00d9f06a71cc4710d4507903
      with:
        node-version: ${{ inputs.node-version }}

    - name: Install strict BLAKE3 checksum tool
      if: inputs.prepare-bootstrap == 'true'
      shell: bash
      run: |
        set -euo pipefail
        if ! command -v b3sum >/dev/null 2>&1; then
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends b3sum
        fi
        command -v b3sum
        b3sum --version

    - name: Install canonical Android toolchain
      shell: bash
      env:
        TERMUX_SKIP_BOOTSTRAP_PREPARE: '1'
      run: ./scripts/ci_android_preflight.sh

    - name: Verify Bash, JavaScript, JDK, NDK, Ninja and fastboot startup
      shell: bash
      env:
        RAFCODEPHI_EXPECT_JAVA_MAJOR: ${{ inputs.java-version }}
        RAFCODEPHI_EXPECT_NODE_MAJOR: ${{ inputs.node-version }}
      run: bash ./scripts/verify_toolchain_startup.sh

    - name: Prepare bootstrap environment
      if: inputs.prepare-bootstrap == 'true'
      shell: bash
      run: ./scripts/prepare_bootstrap_env.sh --github-env --skip-android-preflight
