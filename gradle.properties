## Project-wide Gradle settings.
#
# For more details on how to configure your build environment visit
# http://www.gradle.org/docs/current/userguide/build_environment.html
#
# Specifies the JVM arguments used for the daemon process.
# The setting is particularly useful for tweaking memory settings.
# Default value: -Xmx10248m -XX:MaxPermSize=256m
# org.gradle.jvmargs=-Xmx2048m -XX:MaxPermSize=512m -XX:+HeapDumpOnOutOfMemoryError -Dfile.encoding=UTF-8
#
# When configured, Gradle will run in incubating parallel mode.
# This option should only be used with decoupled projects. More details, visit
# http://www.gradle.org/docs/current/userguide/multi_project_builds.html#sec:decoupled_projects
# org.gradle.parallel=true
org.gradle.jvmargs=-Xmx2048M \
--add-exports=java.base/sun.nio.ch=ALL-UNNAMED \
--add-opens=java.base/java.lang=ALL-UNNAMED \
--add-opens=java.base/java.lang.reflect=ALL-UNNAMED \
--add-opens=java.base/java.io=ALL-UNNAMED \
--add-exports=jdk.unsupported/sun.misc=ALL-UNNAMED
org.gradle.parallel=true
org.gradle.configureondemand=true
org.gradle.caching=true
android.useAndroidX=true
android.javaCompile.suppressSourceTargetDeprecationWarning=true

# Keep the APK install floor at API 21; the RAFCODEΦ local bootstrap records ARM32 runtime floor metadata separately so split/universal APKs are not broken by a global manifest bump.
minSdkVersion=21

# Runtime hotfix: keep target SDK at 28 so Android continues to allow Termux-style
# execution of bootstrap/package binaries from the app private PREFIX. The app can
# still compile against modern SDK APIs via compileSdkVersion below.
targetSdkVersion=28

# Frozen Android toolchain used by CI/local setup. Change intentionally and update
# external/rafcodephi-build-freeze.lock.json in the same reviewed commit.
compileSdkVersion=35
buildToolsVersion=35.0.0
ndkVersion=26.3.11579264

markwonVersion=4.6.2

# Canonical ABI policy (single source of truth for app/module/scripts/CI).
# Keep in sync with README "Canonical ABI Policy" section.
termux.abi.matrix=armeabi-v7a,arm64-v8a
termux.abi.optional=
termux.abi.universal=true
