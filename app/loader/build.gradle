plugins {
    id "com.android.application"
}

android {
    namespace = "com.termux.rafacodephi.loader"
    compileSdk = project.properties.compileSdkVersion.toInteger()

    defaultConfig {
        applicationId "com.termux.rafacodephi.loader"
        minSdk = project.properties.minSdkVersion.toInteger()
        targetSdk = project.properties.targetSdkVersion.toInteger()
        versionCode 1
        versionName "0.1.0-stub"
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }

    packagingOptions {
        resources {
            excludes += ["META-INF/DEPENDENCIES", "META-INF/LICENSE*", "META-INF/NOTICE*"]
        }
    }
}

tasks.register("materializeLoaderApk", Copy) {
    group = "distribution"
    description = "Builds the loader stub and materializes it as build/dist/loader.apk."
    dependsOn("assembleDebug")
    from("${buildDir}/outputs/apk/debug/loader-debug.apk")
    into("${buildDir}/dist")
    rename { "loader.apk" }
}
