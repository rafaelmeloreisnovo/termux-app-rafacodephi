import groovy.json.JsonSlurper
plugins {
    id "com.android.application"
}

ext {
    // The packageVariant defines the bootstrap variant that will be included in the app APK.
    // This must be supported by com.termux.shared.termux.TermuxBootstrap.PackageVariant or app will
    // crash at startup.
    // Bootstrap of a different variant must not be manually installed by the user after app installation
    // by replacing $PREFIX since app code is dependant on the variant used to build the APK.
    // Currently supported values are: [ "apt-android-7" "apt-android-5" ]
    packageVariant = System.getenv("TERMUX_PACKAGE_VARIANT") ?: "apt-android-7" // Default: "apt-android-7"
    bootstrapBaseUrl = System.getenv("TERMUX_BOOTSTRAP_BASE_URL") ?: "https://github.com/termux/termux-packages/releases/download"

    // Canonical side-by-side strategy:
    // - Release defaults to com.termux.rafacodephi for app id and bootstrap metadata.
    // - Legacy compatibility remains opt-in via environment overrides.
    appPackageName = System.getenv("TERMUX_APP_PACKAGE_NAME") ?: "com.termux.rafacodephi"
    bootstrapMetadataPackageName = System.getenv("TERMUX_BOOTSTRAP_PACKAGE_NAME") ?: "com.termux.rafacodephi"
    bootstrapRequiredPageSize = System.getenv("TERMUX_BOOTSTRAP_PAGE_SIZE") ?: "16384"
    bootstrapValidationMode = System.getenv("TERMUX_BOOTSTRAP_VALIDATION_MODE") ?: "auto"
    bootstrapBlake3Aarch64 = System.getenv("TERMUX_BOOTSTRAP_BLAKE3_AARCH64") ?: ""
    bootstrapBlake3Arm = System.getenv("TERMUX_BOOTSTRAP_BLAKE3_ARM") ?: ""
    bootstrapBlake3I686 = System.getenv("TERMUX_BOOTSTRAP_BLAKE3_I686") ?: ""
    bootstrapBlake3X8664 = System.getenv("TERMUX_BOOTSTRAP_BLAKE3_X86_64") ?: ""

    // Optional external acquisition route. Empty URL+SHA pairs disable the loader and preserve
    // the embedded bootstrap. The build never invents either value.
    externalBootstrapUrlAarch64 = System.getenv("TERMUX_EXTERNAL_BOOTSTRAP_URL_AARCH64") ?: ""
    externalBootstrapUrlArm = System.getenv("TERMUX_EXTERNAL_BOOTSTRAP_URL_ARM") ?: ""
    externalBootstrapUrlI686 = System.getenv("TERMUX_EXTERNAL_BOOTSTRAP_URL_I686") ?: ""
    externalBootstrapUrlX8664 = System.getenv("TERMUX_EXTERNAL_BOOTSTRAP_URL_X86_64") ?: ""
    externalBootstrapSha256Aarch64 = System.getenv("TERMUX_EXTERNAL_BOOTSTRAP_SHA256_AARCH64") ?: ""
    externalBootstrapSha256Arm = System.getenv("TERMUX_EXTERNAL_BOOTSTRAP_SHA256_ARM") ?: ""
    externalBootstrapSha256I686 = System.getenv("TERMUX_EXTERNAL_BOOTSTRAP_SHA256_I686") ?: ""
    externalBootstrapSha256X8664 = System.getenv("TERMUX_EXTERNAL_BOOTSTRAP_SHA256_X86_64") ?: ""
}

def buildConfigString(String value) {
    return '"' + value.replace('\\', '\\\\').replace('"', '\\"') + '"'
}

def validateExternalBootstrapPin(String abi, String url, String sha256) {
    boolean hasUrl = url != null && !url.trim().isEmpty()
    boolean hasSha = sha256 != null && !sha256.trim().isEmpty()
    if (hasUrl != hasSha) {
        throw new GradleException("External bootstrap ${abi} requires both URL and SHA-256")
    }
    if (!hasUrl) return
    if (!(sha256 ==~ /^[0-9a-fA-F]{64}$/)) {
        throw new GradleException("External bootstrap ${abi} SHA-256 must contain 64 hexadecimal characters")
    }
    java.net.URI parsed
    try {
        parsed = new java.net.URI(url)
    } catch (Exception e) {
        throw new GradleException("External bootstrap ${abi} URL is invalid", e)
    }
    int port = parsed.port == -1 ? 443 : parsed.port
    if (!"https".equalsIgnoreCase(parsed.scheme) || !parsed.host || parsed.userInfo != null ||
        parsed.fragment != null || port != 443) {
        throw new GradleException("External bootstrap ${abi} URL must be HTTPS on port 443 without user-info or fragment")
    }
}

validateExternalBootstrapPin("aarch64", project.ext.externalBootstrapUrlAarch64, project.ext.externalBootstrapSha256Aarch64)
validateExternalBootstrapPin("arm", project.ext.externalBootstrapUrlArm, project.ext.externalBootstrapSha256Arm)
validateExternalBootstrapPin("i686", project.ext.externalBootstrapUrlI686, project.ext.externalBootstrapSha256I686)
validateExternalBootstrapPin("x86_64", project.ext.externalBootstrapUrlX8664, project.ext.externalBootstrapSha256X8664)

def validateVersionName(String candidateVersionName) {
    def semverRegex = '^(0|[1-9]\\d*)\\.(0|[1-9]\\d*)\\.(0|[1-9]\\d*)(?:-((?:0|[1-9]\\d*|\\d*[a-zA-Z-][0-9a-zA-Z-]*)(?:\\.(?:0|[1-9]\\d*|\\d*[a-zA-Z-][0-9a-zA-Z-]*))*))?(?:\\+([0-9a-zA-Z-]+(?:\\.[0-9a-zA-Z-]+)*))?$'
    if (!java.util.regex.Pattern.matches(semverRegex, candidateVersionName)) {
        throw new GradleException("Invalid semantic versionName: ${candidateVersionName}")
    }
}

def hasReleaseTaskRequested() {
    return gradle.startParameter.taskNames.any { it.toLowerCase(Locale.ROOT).contains("release") }
}

android {
    namespace = project.ext.appPackageName

    compileSdk = project.properties.compileSdkVersion.toInteger()
    ndkVersion = System.getenv("JITPACK_NDK_VERSION") ?: project.properties.ndkVersion
    def appVersionName = System.getenv("TERMUX_APP_VERSION_NAME") ?: ""
    def apkVersionTag = System.getenv("TERMUX_APK_VERSION_TAG") ?: ""
    def splitAPKsForDebugBuilds = System.getenv("TERMUX_SPLIT_APKS_FOR_DEBUG_BUILDS") ?: "1"
    def splitAPKsForReleaseBuilds = System.getenv("TERMUX_SPLIT_APKS_FOR_RELEASE_BUILDS") ?: "0" // F-Droid does not support split APKs #1904
    def requestedReleaseBuild = hasReleaseTaskRequested()
    def baremetalStrictValue = System.getenv("TERMUX_BOOTSTRAP_BAREMETAL_STRICT") ?: (requestedReleaseBuild ? "true" : "false")

    defaultConfig {
        applicationId project.ext.appPackageName
        minSdk = project.properties.minSdkVersion.toInteger()
        targetSdk = project.properties.targetSdkVersion.toInteger()
        versionCode 118
        def effectiveVersionName = appVersionName ?: "0.118.0"
        validateVersionName(effectiveVersionName)
        versionName effectiveVersionName
        versionNameSuffix "-rafacodephi"

        buildConfigField "String", "TERMUX_PACKAGE_VARIANT", buildConfigString(project.ext.packageVariant)
        buildConfigField "String", "BOOTSTRAP_BLAKE3_AARCH64", buildConfigString(project.ext.bootstrapBlake3Aarch64)
        buildConfigField "String", "BOOTSTRAP_BLAKE3_ARM", buildConfigString(project.ext.bootstrapBlake3Arm)
        buildConfigField "String", "BOOTSTRAP_BLAKE3_I686", buildConfigString(project.ext.bootstrapBlake3I686)
        buildConfigField "String", "BOOTSTRAP_BLAKE3_X86_64", buildConfigString(project.ext.bootstrapBlake3X8664)
        buildConfigField "boolean", "BOOTSTRAP_BAREMETAL_STRICT", baremetalStrictValue
        buildConfigField "String", "EXTERNAL_BOOTSTRAP_URL_AARCH64", buildConfigString(project.ext.externalBootstrapUrlAarch64)
        buildConfigField "String", "EXTERNAL_BOOTSTRAP_URL_ARM", buildConfigString(project.ext.externalBootstrapUrlArm)
        buildConfigField "String", "EXTERNAL_BOOTSTRAP_URL_I686", buildConfigString(project.ext.externalBootstrapUrlI686)
        buildConfigField "String", "EXTERNAL_BOOTSTRAP_URL_X86_64", buildConfigString(project.ext.externalBootstrapUrlX8664)
        buildConfigField "String", "EXTERNAL_BOOTSTRAP_SHA256_AARCH64", buildConfigString(project.ext.externalBootstrapSha256Aarch64.toLowerCase(Locale.ROOT))
        buildConfigField "String", "EXTERNAL_BOOTSTRAP_SHA256_ARM", buildConfigString(project.ext.externalBootstrapSha256Arm.toLowerCase(Locale.ROOT))
        buildConfigField "String", "EXTERNAL_BOOTSTRAP_SHA256_I686", buildConfigString(project.ext.externalBootstrapSha256I686.toLowerCase(Locale.ROOT))
        buildConfigField "String", "EXTERNAL_BOOTSTRAP_SHA256_X86_64", buildConfigString(project.ext.externalBootstrapSha256X8664.toLowerCase(Locale.ROOT))

        buildConfigField "int", "CONFIGURED_MIN_SDK", String.valueOf(project.properties.minSdkVersion.toInteger())
        buildConfigField "String", "SUPPORTED_APK_ABIS", buildConfigString(project.findProperty('termux.abi.matrix').toString())

        // Package name configuration fields for runtime access
        buildConfigField "String", "TERMUX_PACKAGE_NAME", buildConfigString(project.ext.appPackageName)
        buildConfigField "String", "BOOTSTRAP_METADATA_PACKAGE_NAME", buildConfigString(project.ext.bootstrapMetadataPackageName)

        manifestPlaceholders.TERMUX_PACKAGE_NAME = project.ext.appPackageName
        manifestPlaceholders.TERMUX_APP_NAME = "Termux RAFCODEΦ"
        manifestPlaceholders.TERMUX_API_APP_NAME = "Termux:API"
        manifestPlaceholders.TERMUX_BOOT_APP_NAME = "Termux:Boot"
        manifestPlaceholders.TERMUX_FLOAT_APP_NAME = "Termux:Float"
        manifestPlaceholders.TERMUX_STYLING_APP_NAME = "Termux:Styling"
        manifestPlaceholders.TERMUX_TASKER_APP_NAME = "Termux:Tasker"
        manifestPlaceholders.TERMUX_WIDGET_APP_NAME = "Termux:Widget"

        externalNativeBuild {
            ndkBuild {
                cFlags "-std=c11", "-Wall", "-Wextra", "-Werror", "-Os", "-fno-stack-protector"
                arguments "NDK_APP_LDFLAGS=-Wl,--gc-sections -Wl,-z,max-page-size=16384"
            }
        }
    }

    splits {
        abi {
            enable = ((gradle.startParameter.taskNames.any { it.contains("Debug") } && splitAPKsForDebugBuilds == "1") ||
                (gradle.startParameter.taskNames.any { it.contains("Release") } && splitAPKsForReleaseBuilds == "1"))
            reset()
            def requiredAbiFilters = project.findProperty('termux.abi.matrix').toString().split(',').findAll { it?.trim() }
            def optionalAbiFilters = project.findProperty('termux.abi.optional').toString().split(',').findAll { it?.trim() }
            include(*((requiredAbiFilters + optionalAbiFilters) as String[]))
            universalApk = true
        }
    }

    def bootstrapBaremetalStrictEnv = System.getenv("TERMUX_BOOTSTRAP_BAREMETAL_STRICT")
    def bootstrapBaremetalStrictOverride = null
    if (bootstrapBaremetalStrictEnv != null && !bootstrapBaremetalStrictEnv.trim().isEmpty()) {
        def normalized = bootstrapBaremetalStrictEnv.trim().toLowerCase(Locale.ROOT)
        if (normalized == "true" || normalized == "1" || normalized == "yes" || normalized == "on") {
            bootstrapBaremetalStrictOverride = true
        } else if (normalized == "false" || normalized == "0" || normalized == "no" || normalized == "off") {
            bootstrapBaremetalStrictOverride = false
        } else {
            throw new GradleException("Invalid TERMUX_BOOTSTRAP_BAREMETAL_STRICT='${bootstrapBaremetalStrictEnv}'. Use true/false.")
        }
    }
    if (hasReleaseTaskRequested() && bootstrapBaremetalStrictOverride == false) {
        throw new GradleException("Release tasks require TERMUX_BOOTSTRAP_BAREMETAL_STRICT=true. Disable is only allowed for debug/internal tracks.")
    }

    def pairedSigningValues = [
        System.getenv("RAFCODEPHI_PAIRED_KEYSTORE_FILE") ?: "",
        System.getenv("RAFCODEPHI_PAIRED_KEYSTORE_PASSWORD") ?: "",
        System.getenv("RAFCODEPHI_PAIRED_KEY_ALIAS") ?: "",
        System.getenv("RAFCODEPHI_PAIRED_KEY_PASSWORD") ?: "",
    ]
    def hasAnyPairedSigningMaterial = pairedSigningValues.any { !it.isEmpty() }
    def hasPairedSigningMaterial = pairedSigningValues.every { !it.isEmpty() }
    if (hasAnyPairedSigningMaterial && !hasPairedSigningMaterial) {
        throw new GradleException("RAFCODEPHI paired signing requires all RAFCODEPHI_PAIRED_* variables.")
    }
    def legacyReleaseSigningValues = [
        System.getenv("TERMUX_RELEASE_KEYSTORE_FILE") ?: "",
        System.getenv("TERMUX_RELEASE_KEYSTORE_PASSWORD") ?: "",
        System.getenv("TERMUX_RELEASE_KEY_ALIAS") ?: "",
        System.getenv("TERMUX_RELEASE_KEY_PASSWORD") ?: "",
    ]
    // A complete paired identity is atomic and takes precedence as a set. Never
    // combine one credential family with partial values from the other family.
    def releaseSigningValues = hasPairedSigningMaterial ? pairedSigningValues : legacyReleaseSigningValues
    def releaseSigningEnabled = (System.getenv("TERMUX_ENABLE_RELEASE_SIGNING") ?: "false").toBoolean() || hasPairedSigningMaterial
    def releaseKeystoreFilePath = releaseSigningValues[0]
    def releaseKeystorePassword = releaseSigningValues[1]
    def releaseKeyAlias = releaseSigningValues[2]
    def releaseKeyPassword = releaseSigningValues[3]
    def hasReleaseSigningMaterial = releaseKeystoreFilePath && releaseKeystorePassword && releaseKeyAlias && releaseKeyPassword
    def useReleaseSigning = false

    if (releaseSigningEnabled) {
        if (!hasReleaseSigningMaterial) {
            throw new GradleException("TERMUX_ENABLE_RELEASE_SIGNING=true requires TERMUX_RELEASE_KEYSTORE_FILE, TERMUX_RELEASE_KEYSTORE_PASSWORD, TERMUX_RELEASE_KEY_ALIAS and TERMUX_RELEASE_KEY_PASSWORD.")
        }
        File releaseKeystoreFile = file(releaseKeystoreFilePath)
        if (!releaseKeystoreFile.exists()) {
            throw new GradleException("Release keystore file not found at '${releaseKeystoreFile.absolutePath}'.")
        }

        signingConfigs {
            release {
                storeFile releaseKeystoreFile
                storePassword releaseKeystorePassword
                keyAlias releaseKeyAlias
                keyPassword releaseKeyPassword
                enableV1Signing true
                enableV2Signing true
            }
        }
        useReleaseSigning = true
        logger.lifecycle("Release signing is enabled with explicit TERMUX release signing environment variables.")
    } else {
        logger.lifecycle("Release signing is disabled. assembleRelease will generate an unsigned artifact.")
    }

    buildTypes {
        release {
            minifyEnabled true
            shrinkResources = false // Reproducible builds
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
            buildConfigField "boolean", "BOOTSTRAP_BAREMETAL_STRICT", (bootstrapBaremetalStrictOverride != null ? bootstrapBaremetalStrictOverride : true).toString()
            if (useReleaseSigning) {
                signingConfig signingConfigs.release
            }
        }

        debug {
            buildConfigField "boolean", "BOOTSTRAP_BAREMETAL_STRICT", (bootstrapBaremetalStrictOverride != null ? bootstrapBaremetalStrictOverride : false).toString()
            if (useReleaseSigning) {
                signingConfig signingConfigs.release
            }
        }
    }

    compileOptions {
        coreLibraryDesugaringEnabled = true
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    externalNativeBuild {
        ndkBuild {
            path "src/main/cpp/Android.mk"
        }
    }

    lint {
        disable 'ProtectedPermissions'
    }

    testOptions {
        unitTests {
            includeAndroidResources = true
        }
    }

    packagingOptions {
        jniLibs {
            useLegacyPackaging = true
        }
    }

    applicationVariants.all { variant ->
        variant.outputs.all { output ->
            def abi = output.getFilter(com.android.build.OutputFile.ABI)
            def abiSuffix = abi ?: "universal"
            if (variant.buildType.name == "debug") {
                if (apkVersionTag) {
                    outputFileName = new File("termux-app_${apkVersionTag}_${abiSuffix}.apk")
                } else {
                    outputFileName = new File("termux-rafcodephi-debug-${abiSuffix}.apk")
                }
            } else if (variant.buildType.name == "release") {
                if (apkVersionTag) {
                    outputFileName = new File("termux-app_${apkVersionTag}_${abiSuffix}.apk")
                } else {
                    outputFileName = new File("termux-rafcodephi-release-${abiSuffix}.apk")
                }
            }
        }
    }

    buildFeatures {
        buildConfig = true
    }
}

def rafcodephiBootstrapZips = [
    file("src/main/cpp/rewritten-bootstrap-aarch64.zip"),
    file("src/main/cpp/rewritten-bootstrap-arm.zip"),
    file("src/main/cpp/rewritten-bootstrap-i686.zip"),
    file("src/main/cpp/rewritten-bootstrap-x86_64.zip"),
]

tasks.register("validateAndroid15Compatibility") {
    group = "verification"
    description = "Validates Android 15/16 16KB page-size alignment contract for api_lowlevel."
    doLast {
        def pageSize = project.ext.bootstrapRequiredPageSize.toInteger()
        if (pageSize != 16384)
            throw new GradleException("bootstrapRequiredPageSize must be 16384 for Android 15/16, got ${pageSize}")
        def mk = file("src/main/cpp/Android.mk").text
        if (!mk.contains("max-page-size=16384"))
            throw new GradleException("Android.mk must contain -Wl,-z,max-page-size=16384")
    }
}

tasks.register("verifyBootstrapZipsPresent") {
    group = "verification"
    description = "Verifies that all four RAFCODEPHI bootstrap zips are present before native build."
    doLast {
        rafcodephiBootstrapZips.each { f ->
            if (!f.exists()) throw new GradleException("Missing bootstrap zip: ${f.absolutePath}")
        }
    }
}

tasks.register("validateSideBySideContract", Exec) {
    group = "verification"
    description = "Validates canonical RAFCODEPHI side-by-side package/bootstrap contract."
    workingDir rootProject.projectDir
    commandLine "python3", "scripts/validate_side_by_side_contract.py"
}
