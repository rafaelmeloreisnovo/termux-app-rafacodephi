plugins {
  id 'com.android.library'
}

def rafaeliaNativeBridgeEnabled = providers.gradleProperty("rafaelia.nativeBridge.enabled")
    .map { it.toBoolean() }
    .orElse(false)
    .get()
def rafaeliaWorkRuntimeEnabled = providers.gradleProperty("rafaelia.workRuntime.enabled")
    .map { it.toBoolean() }
    .orElse(false)
    .get()

android {
  namespace = "com.termux.rafaelia"
  
  compileSdk = project.properties.compileSdkVersion.toInteger()
  if (rafaeliaNativeBridgeEnabled) {
    ndkVersion = System.getenv("JITPACK_NDK_VERSION") ?: project.properties.ndkVersion
  }

  defaultConfig {
    minSdk = project.properties.minSdkVersion.toInteger()
    targetSdk = project.properties.targetSdkVersion.toInteger()
    
    if (rafaeliaNativeBridgeEnabled) {
      externalNativeBuild {
        ndkBuild {
          cFlags "-std=c11", "-Wall", "-Wextra", "-Werror", "-Os", "-fno-stack-protector"
        }
      }
    }

    testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
  }

  if (rafaeliaNativeBridgeEnabled) {
    externalNativeBuild {
      ndkBuild {
        path "src/main/cpp/Android.mk"
      }
    }
  }

  sourceSets {
    main {
      if (!rafaeliaWorkRuntimeEnabled) {
        java {
          exclude "**/RafaeliaBatchScheduler.java"
          exclude "**/RafaeliaBatchWorker.java"
        }
      }
    }
  }

  compileOptions {
    sourceCompatibility JavaVersion.VERSION_1_8
    targetCompatibility JavaVersion.VERSION_1_8
  }

  buildTypes {
    release {
      minifyEnabled false
    }
  }

  testOptions {
    unitTests {
      returnDefaultValues = true
      all {
        // Enable unit tests - tests that require native libraries
        // will be mocked or skipped via @Ignore annotations
        enabled = true
      }
    }
  }
}

dependencies {
  if (rafaeliaWorkRuntimeEnabled) {
    implementation 'androidx.annotation:annotation:1.8.2'
    implementation 'androidx.work:work-runtime:2.9.1'
  }
  testImplementation 'junit:junit:4.13.2'
  // Local JVM tests exercise the same org.json contract used on Android.
  // The Android mockable jar returns default/null values for framework APIs,
  // which would turn valid audit JSON into false failures. Keep production on
  // the platform implementation while giving unit tests a real JSON runtime.
  testImplementation 'org.json:json:20240303'
}
